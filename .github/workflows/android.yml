name: Android

# Compile smoke test on every push: one ABI, native library only — no APK packaging, no
# signing, no artifacts. Full multi-ABI APK builds live in package.yml (build.yml /
# release.yml).
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'Drift_icon.png'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.1
  # qtshadertools builds the QuickEffects shaders; qtimageformats supplies the qwebp and qtiff
  # plugins. Those plugins have no link-time reference, so nothing in the build fails without
  # them — androiddeployqt simply bundles no qwebp and every .webp/.tiff still decodes to a null
  # QImage on device. Keep this in sync with QT_MODULES for the desktop jobs.
  QT_ANDROID_MODULES: "qtmultimedia qtshadertools qtimageformats"
  # The version every module manifest in the Qt kit names — see scripts/build.sh.
  NDK_VERSION: 27.2.12479018

jobs:
  compile:
    name: Compile arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ABI: arm64-v8a

    steps:
      - uses: actions/checkout@v4

      # The Qt kit, the NDK, a JUCE clone, the FFmpeg/OpenSSL source trees and an
      # unstripped ~280 MB libdrift.so do not fit alongside the image's preinstalled
      # toolchains on a 14 GB runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf "$ANDROID_SDK_ROOT"/ndk
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The `env` context does not carry the runner image's own variables, so the SDK
      # and NDK paths are published into it once here for every step below.
      - name: Resolve SDK and NDK paths
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm meson pkg-config ccache \
            libgl1 libegl1 libxkbcommon0 libfontconfig1

      - name: Install Android NDK ${{ env.NDK_VERSION }} and SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      # aqt rather than an action: since Qt 6.8 the Android kits are published under the
      # `all_os` host, which the wrapper actions address inconsistently.
      - name: Install Qt ${{ env.QT_VERSION }} (host + Android)
        run: |
          pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            -m $QT_ANDROID_MODULES -O "$HOME/Qt"
          aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a \
            -m $QT_ANDROID_MODULES -O "$HOME/Qt"

      # FFmpeg, x264, zstd, OpenSSL and SoundTouch cross-built for Android: ~45 min,
      # and they only change when the script that pins their tags does.
      - name: Restore prebuilt native dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prebuilt
          key: android-deps-${{ env.ABI }}-${{ env.NDK_VERSION }}-${{ hashFiles('third_party/build-android.sh', 'third_party/build-skia.sh') }}

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          ./third_party/build-android.sh "$ABI"
          JOBS="$(nproc)" ./third_party/build-skia.sh "android-$ABI"

      # Saved before the app build so a compile failure does not throw away 45 minutes
      # of dependency work.
      - name: Save prebuilt native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prebuilt
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Drop native dependency sources
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf third_party/src

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-smoke-${{ env.ABI }}-${{ github.sha }}
          restore-keys: ccache-android-smoke-${{ env.ABI }}-

      # Native compile only: catches Android-specific C++/Qt breakage without gradle packaging.
      # Package identity still uses the CI id so a local full build with these env vars stays
      # installable beside a release APK.
      - name: Compile (no APK)
        env:
          DRIFT_ANDROID_PACKAGE_NAME: org.cutwire.drift.ci
          DRIFT_ANDROID_APP_NAME: Drift CI
          SKIP_APK: '1'
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        run: |
          export QT_ANDROID_ROOT="$HOME/Qt/$QT_VERSION/android_arm64_v8a"
          export QT_HOST_PATH="$HOME/Qt/$QT_VERSION/gcc_64"
          ./scripts/build.sh "$ABI" Release
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-smoke-${{ env.ABI }}-${{ github.sha }}
