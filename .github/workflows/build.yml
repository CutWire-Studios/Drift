name: Build

# Manual, unversioned dry run of the release builds. Use this to prove a platform green before
# pushing a tag — a tag is public the moment release.yml finishes, so a failure there is expensive.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platform(s) to build (pick one to test a single side first)"
        required: true
        default: all
        type: choice
        options:
          - all
          - flatpak
          - linux
          - windows
          - macos
          - arch

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Compute metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Compute version
        id: meta
        shell: bash
        run: echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: meta
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      platforms: ${{ inputs.platforms }}
