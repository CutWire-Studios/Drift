name: Microsoft Store MSIX

# Manual Microsoft Store package. The Inno installer and portable zip stay in package.yml; this is
# the one artifact Partner Center accepts for an MSIX submission. It is unsigned on purpose: the
# Store re-signs every package with its own certificate. Run it from main (so this file and
# installer/msix exist) and point `ref` at the tag or commit you want inside the package.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit (short SHA is fine). Empty = this workflow revision. 'latest' = newest GitHub release tag."
        required: false
        default: ""
        type: string
      version:
        description: "MSIX version A.B.C.0; leave empty to use the CMake version plus .0. Must increase for each Store upload."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: msstore-msix-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CCACHE_VERSION: "4.14.2"
  # Same pins as package.yml; keep them in sync.
  QT_VERSION: "6.10.3"
  QT_MODULES: >-
    qtmultimedia
    qtimageformats
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  FFMPEG_REPO: "CutWire-Studios/FFmpeg-Builds"
  FFMPEG_TAG: "n7.1"

jobs:
  msix:
    name: Windows MSIX (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      # Each arch reports its own result: a failing arm64 build should not hide x64's.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            msvc_arch: x64
            ccache_arch: x86_64
            ffmpeg_platform: win64
          - arch: arm64
            runner: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            msvc_arch: arm64
            ccache_arch: aarch64
            ffmpeg_platform: winarm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # `ref` may be a tag from before installer/msix existed, so the manifest and logos come from
      # this workflow revision, not from the checkout that gets built.
      - name: Stash MSIX template
        shell: bash
        run: |
          set -euo pipefail
          cp -r installer/msix "$RUNNER_TEMP/msix"

      - name: Check out requested ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF='${{ inputs.ref }}'
          REF="${REF#"${REF%%[![:space:]]*}"}"
          REF="${REF%"${REF##*[![:space:]]}"}"
          case "$REF" in
            ''|HEAD) ;;
            latest)
              REF="$(gh release view --json tagName --jq .tagName)"
              echo "latest release tag: $REF"
              git checkout --force "$REF"
              ;;
            *)
              git checkout --force "$REF"
              ;;
          esac
          echo "HEAD=$(git rev-parse HEAD) ($(git describe --tags --always))"

      - name: Record checkout and resolve MSIX version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          VERSION="$(grep -oP '^project\(Drift VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          MV='${{ inputs.version }}'
          if [ -n "$MV" ]; then
            if ! [[ "$MV" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.0$ ]]; then
              echo "::error::version must be A.B.C.0 (the Store requires the last part to be 0), got '$MV'"
              exit 1
            fi
          else
            MV="$VERSION.0"
          fi
          IFS=. read -r a b c d <<< "$MV"
          for p in "$a" "$b" "$c"; do
            if [ "$p" -gt 65535 ]; then
              echo "::error::each MSIX version part must be at most 65535, got '$MV'"
              exit 1
            fi
          done
          # Tags from before windows-store existed reject it at configure; they still build as a
          # Store package, just reported to the marketplace as the plain windows distribution.
          if grep -q 'windows-store' CMakeLists.txt; then DIST=windows-store; else DIST=windows; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "msix_version=$MV" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          echo "Built $SHA (version=$VERSION msix=$MV distribution=$DIST) from ref '${{ inputs.ref }}'"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      # Same key as package.yml's windows job so a Store build reuses the installer job's vcpkg binaries.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}
          restore-keys: |
            vcpkg-bincache-win-${{ matrix.arch }}-

      # See package.yml for why zlib and Skia are static-md while the rest are dynamic.
      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install zstd openssl soundtouch --triplet ${{ matrix.arch }}-windows
          .\vcpkg\vcpkg.exe install zlib "skia[gl,harfbuzz,icu,freetype,png]" --triplet ${{ matrix.arch }}-windows-static-md

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-win-${{ hashFiles('CMakeLists.txt') }}

      - name: Fetch pinned FFmpeg
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .deps\ffmpeg, .deps\ffmpeg_extracted -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .deps\ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:FFMPEG_REPO/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-${{ matrix.ffmpeg_platform }}-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .deps\ffmpeg_extracted -Force
          $extractedRoot = (Get-ChildItem .deps\ffmpeg_extracted)[0].FullName
          Copy-Item -Path "$extractedRoot\*" -Destination .deps\ffmpeg -Recurse -Force

      # The official zip rather than choco: pinned, and no package-feed dependency. The arm64
      # runner gets the native build.
      - name: Install ccache
        shell: pwsh
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-${{ matrix.ccache_arch }}"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile ccache.zip
          Expand-Archive -Path ccache.zip -DestinationPath "$env:RUNNER_TEMP\ccache-bin" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ccache-bin\$name"
          & "$env:RUNNER_TEMP\ccache-bin\$name\ccache.exe" --version

      # Ninja needs the compiler environment that the Visual Studio generator used to set up for
      # itself. Placed after the vcpkg step, which finds Visual Studio on its own.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Restore only: this runs on arbitrary refs, and a save would replace the cache package.yml's
      # installer job keeps for the same prefix. See package.yml for the ccache and MSVC flags.
      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-windows-${{ matrix.arch }}-
          max-size: 1G

      # An empty update feed turns the in-app update check off: the Store owns updates here.
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};${{ github.workspace }}\.deps\ffmpeg;${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md" `
            -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }} `
            -DZLIB_INCLUDE_DIR=${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md\include `
            -DZLIB_LIBRARY=${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md\lib\zs.lib `
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF `
            -DDRIFT_BUNDLE_CORE_PACKAGES_ONLY=ON `
            -DDRIFT_WITH_SKIA=ON `
            -DDRIFT_DISTRIBUTION=${{ steps.meta.outputs.distribution }} `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DDRIFT_PCH=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DDRIFT_UPDATE_FEED_URL=

      # Only what ships: package.yml already builds and runs the test suite on Windows.
      - name: Build
        shell: pwsh
        run: cmake --build build --parallel 3 --target drift audiobackendcheck

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item build\drift.exe dist\bin -Force
          # See package.yml for --no-opengl-sw.
          & "${{ env.QT_ROOT_DIR }}\bin\windeployqt.exe" --release --no-translations `
            --no-opengl-sw --qmldir src\qml dist\bin\drift.exe
          Copy-Item vcpkg\installed\${{ matrix.arch }}-windows\bin\*.dll dist\bin -Force
          Copy-Item .deps\ffmpeg\bin\*.dll dist\bin -Force
          foreach ($dir in "effects", "transitions", "effect-templates", "audio-effects") {
            if (Test-Path "build\$dir") {
              Copy-Item "build\$dir" dist\bin -Recurse -Force
            }
          }

      # An MSIX cannot run vc_redist.${{ matrix.arch }}.exe at install time, so the CRT goes in app-local.
      - name: Bundle MSVC runtime
        shell: pwsh
        run: |
          Remove-Item dist\bin\vc_redist*.exe -Force -ErrorAction SilentlyContinue
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem "$($redist.FullName)\${{ matrix.arch }}" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "no Microsoft.VC*.CRT under $($redist.FullName)\${{ matrix.arch }}" }
          Write-Host "CRT from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" dist\bin -Force

      - name: Verify audio backend
        shell: pwsh
        env:
          QT_DEBUG_PLUGINS: "1"
        run: |
          $pluginRel = "dist\bin\multimedia\ffmpegmediaplugin.dll"
          if (-not (Test-Path $pluginRel)) {
            Get-ChildItem dist\bin\multimedia -ErrorAction SilentlyContinue
            throw "$pluginRel was not deployed; QAudioSink would have no devices at all"
          }
          $plugin = (Resolve-Path $pluginRel).Path
          Copy-Item build\audiobackendcheck.exe dist\bin -Force
          Push-Location dist\bin
          try {
            & .\audiobackendcheck.exe $plugin
            $status = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Remove-Item dist\bin\audiobackendcheck.exe -Force
          if ($status -ne 0) {
            throw "the multimedia backend plugin does not load against the DLLs being shipped"
          }

      - name: Pack MSIX
        shell: pwsh
        env:
          MSIX_VERSION: ${{ steps.meta.outputs.msix_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $layout = "$env:RUNNER_TEMP\layout"
          New-Item -ItemType Directory -Force -Path $layout, out | Out-Null
          Copy-Item dist\bin\* $layout -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\msix\Assets" $layout -Recurse -Force
          (Get-Content "$env:RUNNER_TEMP\msix\AppxManifest.xml" -Raw).Replace('@VERSION@', $env:MSIX_VERSION).Replace('@ARCH@', $env:ARCH) |
            Set-Content "$layout\AppxManifest.xml" -Encoding utf8

          # x64 makeappx on both runners: the SDK always carries it and it runs under emulation on arm64.
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          Write-Host "Using $($makeappx.FullName)"

          $msix = "out\Drift-$env:MSIX_VERSION-$env:ARCH.msix"
          & $makeappx.FullName pack /d $layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
          & $makeappx.FullName unpack /p $msix /d "$env:RUNNER_TEMP\unpacked" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx could not read back $msix" }
          Get-Item $msix | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: drift-${{ steps.meta.outputs.msix_version }}-msix-${{ matrix.arch }}
          path: out/Drift-${{ steps.meta.outputs.msix_version }}-${{ matrix.arch }}.msix
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Microsoft Store MSIX"
            echo "- **ref:** \`${{ inputs.ref }}\`"
            echo "- **commit:** \`${{ steps.meta.outputs.sha }}\`"
            echo "- **version:** ${{ steps.meta.outputs.version }}"
            echo "- **MSIX version:** ${{ steps.meta.outputs.msix_version }}"
            echo "- **distribution:** ${{ steps.meta.outputs.distribution }}"
            echo "- **arch:** ${{ matrix.arch }}"
            echo "- **artifact:** \`Drift-${{ steps.meta.outputs.msix_version }}-${{ matrix.arch }}.msix\` (\`drift-${{ steps.meta.outputs.msix_version }}-msix-${{ matrix.arch }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Partner Center takes one upload covering both architectures. Unsigned like the per-arch
  # packages: the Store re-signs the bundle.
  msixbundle:
    name: Windows MSIX bundle
    needs: msix
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drift-*-msix-*
          merge-multiple: true
          path: in

      # The version is read back from the package names, so this job needs nothing from the
      # matrix jobs but their artifacts.
      - name: Bundle
        id: bundle
        shell: pwsh
        run: |
          $msix = Get-ChildItem in\*.msix
          Get-Item $msix | Format-Table Name, Length
          foreach ($arch in "x64", "arm64") {
            if (-not ($msix | Where-Object Name -like "*-$arch.msix")) { throw "no $arch package among the downloaded artifacts" }
          }
          $ver = ($msix[0].BaseName -replace '^Drift-(.+)-(x64|arm64)$', '$1')
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $bundle = "out\Drift-$ver.msixbundle"
          & $makeappx.FullName bundle /d in /p $bundle /bv $ver /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed" }
          Get-Item $bundle | Format-List Name, Length
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: drift-${{ steps.bundle.outputs.version }}-msixbundle
          path: out/Drift-${{ steps.bundle.outputs.version }}.msixbundle
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Microsoft Store MSIX bundle"
            echo "- **artifact:** \`Drift-${{ steps.bundle.outputs.version }}.msixbundle\` (\`drift-${{ steps.bundle.outputs.version }}-msixbundle\`)"
          } >> "$GITHUB_STEP_SUMMARY"
