name: Package

# The one place every platform build is defined. Both callers — build.yml (manual, unversioned)
# and release.yml (tag-triggered, publishes) — reuse this so a fix to a build never has to be
# applied twice.
on:
  workflow_call:
    inputs:
      version:
        description: "Version string baked into artifact names"
        required: true
        type: string
      platforms:
        description: "all, flatpak, linux, windows, macos, arch or android"
        required: false
        default: all
        type: string
      android_identity:
        description: "release (org.cutwire.drift), ci (….ci) or nightly (….nightly) package id"
        required: false
        default: ci
        type: string
      channel:
        description: "stable or nightly"
        required: false
        default: stable
        type: string
      build_id:
        description: "Nightly build stamp, YYYYMMDD.<short sha>; ignored on the stable channel"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Nightly artifacts are named for the channel rather than the version, so that
  # …/releases/download/nightly/Drift-nightly-x86_64.AppImage is a permanent link and the single
  # rewritten pre-release has exactly one file per platform to clobber each night. The exact
  # version is in the release body and in the app's Settings pane.
  ASSET_LABEL: ${{ inputs.channel == 'nightly' && 'nightly' || inputs.version }}
  # Passed to every desktop Configure step. A nightly gets its own app id, bundle id and version
  # suffix out of these, and no update check: the badge can only point at stable releases, which
  # is not what someone running a nightly wants to be nagged towards.
  DRIFT_CHANNEL_ARGS: >-
    -DDRIFT_CHANNEL=${{ inputs.channel }}
    -DDRIFT_BUILD_ID=${{ inputs.build_id }}
    ${{ inputs.channel == 'nightly' && '-DDRIFT_UPDATE_FEED_URL=' || '' }}
  QT_VERSION: "6.10.3"
  # Drift needs Quick, QuickControls2, QuickEffects, Widgets, OpenGL, Network, Concurrent and Test
  # (qtbase + qtdeclarative, both in the base install); qtmultimedia is the only extra it links.
  # qtimageformats is for the import side: without it webp/tiff stills cannot be added to a project.
  # LinguistTools (lupdate) ships in the default qttools archive — it is not an aqtinstall module.
  QT_MODULES: >-
    qtmultimedia
    qtimageformats
  # Deliberately not QT_QPA_PLATFORM=offscreen: that plugin cannot create an OpenGL context on a
  # runner with no /dev/dri, so every compositor test renders a null QImage. Mesa is not the
  # problem — llvmpipe works fine once there is an X server, so the test steps run under Xvfb on
  # the xcb plugin instead. See the Test step below.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  # Pinned to the FFmpeg *branch* QtMultimedia's ffmpeg backend bundles for QT_VERSION above (check
  # doc.qt.io/qt-6/qtmultimedia-attribution-ffmpeg.html when bumping QT_VERSION). Drift links
  # FFmpeg itself *and* loads Qt's multimedia backend for audio output, so both copies are in the
  # process; sharing a branch is what keeps that from being two ABIs of the same library.
  #
  # Hosted on CutWire-Studios/FFmpeg-Builds rather than BtbN's moving `latest` tag: BtbN dropped
  # n7.1 from latest on 2026-08-17 (they now ship n8.1 / n9.0), and their dated autobuild tags are
  # deleted after ~2 weeks. The n7.1 release on our fork is a stable URL for this soversion.
  #
  # The gpl variant, not lgpl: x264 and x265 are GPL, so the lgpl builds carry no H.264/H.265
  # encoder at all — which leaves the default export settings unencodable and MatteWriter with
  # nothing to write a matte with. Drift is GPLv3 (see LICENSE), so linking them is fine.
  FFMPEG_REPO: "CutWire-Studios/FFmpeg-Builds"
  FFMPEG_TAG: "n7.1"

jobs:
  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: inputs.platforms == 'all' || inputs.platforms == 'flatpak'
    strategy:
      # Each arch reports its own result: a failing aarch64 build should not hide x86_64's.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner image adds packages.microsoft.com; azure-cli.list is the one *microsoft* misses.
          # GitHub's apt-mirrors.txt tries azure.archive then archive.ubuntu.com; both stall.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          printf '%s\n' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
            'Acquire::Retries "2";' 'APT::Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          # The mirror list is x86 only: arm runners fetch from ports.ubuntu.com, which these
          # archive mirrors do not carry.
          if [ "$(uname -m)" = x86_64 ]; then
            {
              curl -fsSL --max-time 8 http://mirrors.ubuntu.com/mirrors.txt || true
              echo "http://us.archive.ubuntu.com/ubuntu/"
              echo "http://security.ubuntu.com/ubuntu/"
            } | sed 's:/*$:/:' \
              | grep -vi 'azure.archive.ubuntu.com' \
              | grep -viE '^https?://archive\.ubuntu\.com/' \
              | awk 'NF && !seen[$0]++' \
              | awk '{ printf "%s\tpriority:%d\n", $0, NR }' \
              | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Lint flatpak manifest and metadata
        run: |
          appstreamcli validate --no-net flatpak/org.cutwire.Drift.metainfo.xml
          desktop-file-validate flatpak/org.cutwire.Drift.desktop
          flatpak-builder --show-manifest flatpak/org.cutwire.Drift.yml > /dev/null
          flatpak-builder --show-manifest flatpak/org.cutwire.Drift.flathub.yml > /dev/null

      - name: Cache flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ matrix.arch }}-${{ hashFiles('flatpak/org.cutwire.Drift.yml') }}

      # A nightly bundle installed under org.cutwire.Drift would replace the user's Flathub
      # install, so it gets its own app id — and with it its own .desktop, icon and AppStream id,
      # which CMake renames on the nightly channel (flatpak build-export drops anything in
      # /app/share not named after the app id).
      - name: Generate the nightly manifest
        if: inputs.channel == 'nightly'
        run: |
          python3 scripts/make-nightly-flatpak-manifest.py "${{ inputs.build_id }}"
          flatpak-builder --show-manifest flatpak/org.cutwire.Drift.Nightly.yml > /dev/null

      # The local manifest (not the Flathub one) — it builds the working tree, so it validates the
      # commit under test rather than whatever tag the Flathub manifest is pinned to.
      - name: Build flatpak
        env:
          MANIFEST: ${{ inputs.channel == 'nightly' && 'flatpak/org.cutwire.Drift.Nightly.yml' || 'flatpak/org.cutwire.Drift.yml' }}
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo="${{ runner.temp }}/flatpak-repo" \
            "${{ runner.temp }}/flatpak-build" \
            "${MANIFEST}"

      - name: Export bundle
        env:
          APP_ID: ${{ inputs.channel == 'nightly' && 'org.cutwire.Drift.Nightly' || 'org.cutwire.Drift' }}
        run: |
          mkdir -p dist
          flatpak build-bundle "${{ runner.temp }}/flatpak-repo" \
            "dist/Drift-${{ env.ASSET_LABEL }}-${{ matrix.arch }}.flatpak" \
            "${APP_ID}" --arch="${{ matrix.arch }}"

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: dist/*.flatpak

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      # Each arch reports its own result: a failing aarch64 build should not hide x86_64's.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            # Also the ONNX Runtime addon suffix and the build-skia.sh target.
            target: linux-x64
            ffmpeg_platform: linux64
            libdir: /usr/lib/x86_64-linux-gnu
          # Disabled: the FFmpeg-Builds n7.1 release has no linuxarm64 asset yet.
          # - arch: aarch64
          #   runner: ubuntu-22.04-arm
          #   qt_host: linux_arm64
          #   qt_arch: linux_gcc_arm64
          #   target: linux-arm64
          #   ffmpeg_platform: linuxarm64
          #   libdir: /usr/lib/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # fonts/, emoji-fonts/ and the addon effect catalogue are gitignored addon content; the tests
      # need them. Same sparse checkout as tests.yml.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      # The DeepFilterNet3 and Silero VAD weights and the ONNX Runtime are gitignored in Drift-Addons,
      # so they come from the public packages release. Unpacked where the tests look for them.
      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p onnxruntime.cpu.${{ matrix.target }}-1.0.0.driftpkg
          python3 scripts/unpack-driftpkg.py "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python3 scripts/unpack-driftpkg.py "$dl/silero.vad-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad"
          python3 scripts/unpack-driftpkg.py "$dl/onnxruntime.cpu.${{ matrix.target }}-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d "${GITHUB_WORKSPACE}/models/deepfilternet3"
          test -f "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx"
          test -f "${GITHUB_WORKSPACE}/.ort/runtime/lib/libonnxruntime.so"

      - name: Stage addon content where the tests expect it
        shell: bash
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts fonts
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font emoji-fonts
          ln -s "${GITHUB_WORKSPACE}/drift-addons" "${GITHUB_WORKSPACE}/../drift-addons"
          test -f fonts/anton/Anton-400.ttf
          test -f emoji-fonts/HarmonyOS_4.0.ttf
          test -f "${GITHUB_WORKSPACE}/../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json"

      # cmake is deliberately not installed from apt: the runner image already carries a newer one
      # on PATH and apt's would only add ambiguity.
      # libva* are runtime, not build, deps: FFmpeg reaches VA-API through implib-gen stubs
      # whose generated dlopen failure path is assert(0). hwaccel::deviceAvailable() now
      # guards that, so their absence no longer SIGABRTs — they stay so the tests probe VAAPI
      # for real instead of taking the guard's early-out on every run.
      - name: Install native build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner image adds packages.microsoft.com; azure-cli.list is the one *microsoft* misses.
          # GitHub's apt-mirrors.txt tries azure.archive then archive.ubuntu.com; both stall.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          printf '%s\n' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
            'Acquire::Retries "2";' 'APT::Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          # The mirror list is x86 only: arm runners fetch from ports.ubuntu.com, which these
          # archive mirrors do not carry.
          if [ "$(uname -m)" = x86_64 ]; then
            {
              curl -fsSL --max-time 8 http://mirrors.ubuntu.com/mirrors.txt || true
              echo "http://us.archive.ubuntu.com/ubuntu/"
              echo "http://security.ubuntu.com/ubuntu/"
            } | sed 's:/*$:/:' \
              | grep -vi 'azure.archive.ubuntu.com' \
              | grep -viE '^https?://archive\.ubuntu\.com/' \
              | awk 'NF && !seen[$0]++' \
              | awk '{ printf "%s\tpriority:%d\n", $0, NR }' \
              | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -o Acquire::Retries=3
          # Complex-script text tests need Noto faces.
          sudo apt-get install -y -o Acquire::Retries=3 \
            build-essential ninja-build pkg-config git xvfb zsync ccache fonts-noto-core \
            libgl1-mesa-dev libegl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libzstd-dev libssl-dev libsoundtouch-dev zlib1g-dev \
            libpulse-dev libasound2-dev \
            libva2 libva-drm2 libva-x11-2 \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            clang-15 lld libharfbuzz-dev libexpat1-dev libpng-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-cursor-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-linux-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}

      # Skia is built once per script revision and cached: 15–20 minutes on a miss, seconds on a
      # hit. clang-15 because Skia's GN toolchain files are written for clang and jammy's default
      # `clang` is 14. SKIA_SYSTEM_ICU=0 compiles Skia's own ICU with embedded data instead of
      # letting linuxdeploy bundle the distro's libicudata (~30 MB) next to the copy Qt already
      # ships. The source tree goes straight after: ~1 GB the AppImage step has no use for.
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: third_party/prebuilt/skia/${{ matrix.target }}
          key: v2-skia-${{ matrix.target }}-${{ hashFiles('third_party/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          JOBS="$(nproc)" CC=clang-15 CXX=clang++-15 SKIA_SYSTEM_ICU=0 third_party/build-skia.sh ${{ matrix.target }}
          rm -rf third_party/src

      - name: Fetch pinned FFmpeg
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          mkdir -p "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          curl -fsSL "https://github.com/${FFMPEG_REPO}/releases/download/${FFMPEG_TAG}/ffmpeg-${FFMPEG_TAG}-${{ matrix.ffmpeg_platform }}-gpl-shared.tar.xz" \
            | tar -xJf - --strip-components=1 -C "${GITHUB_WORKSPACE}/.deps/ffmpeg"

      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-appimage-${{ matrix.arch }}-
          max-size: 700M

      # DRIFT_BUNDLE_ONNXRUNTIME=OFF: a packaged build ships no runtime at all. Drift dlopens the
      # one the user installs from the Acceleration category, which is what keeps the CPU / CUDA /
      # WebGPU choice theirs instead of the packager's. Only the headers are fetched, to compile.
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/.deps/ffmpeg" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF \
            -DDRIFT_BUNDLE_CORE_PACKAGES_ONLY=ON \
            -DDRIFT_WITH_SKIA=ON \
            -DDRIFT_DISTRIBUTION=appimage \
            -DDRIFT_LINKER=lld \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${DRIFT_CHANNEL_ARGS}

      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-appimage-${{ matrix.arch }}-
          max-size: 700M

      # The same command the README documents. Xvfb is what makes the GPU tests real here: only
      # some of them guard on GpuEffectExecutor::isAvailable() and QSKIP, the rest compare against
      # whatever the compositor returned, which is a null QImage when there is no GL context.
      # Models and font bundles that are not in the repo do skip themselves.
      #
      # LD_LIBRARY_PATH is prepended rather than appended: install-qt-action puts Qt's lib dir on
      # it, and QtMultimedia ships its own libavcodec.so.61 under the same soname, built with no
      # external codec libraries. Appending let that copy win, so the suite exercised an FFmpeg
      # the app was never built against and never ships. Prepending also still supplies
      # libpostproc.so.58, which only the gpl FFmpeg ships (postproc is GPL-only) and which
      # libavfilter needs: CMake gives the test binaries a build RPATH covering that directory,
      # but emits it as DT_RUNPATH, and the loader applies RUNPATH only to the binary's own NEEDED
      # entries — never to a dependency's. libavfilter carries no RUNPATH of its own, so nothing
      # found libpostproc.
      # The ONNX and sticker tests skip without these two; the workspace paths are where the
      # fetch and checkout steps above put the files. The pinned FFmpeg's bin/ffmpeg goes on PATH
      # for the tests that synthesize their clips through it; the runner image has none.
      - name: Test
        id: test
        env:
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          export PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/bin:${PATH}"
          test -x "${GITHUB_WORKSPACE}/.deps/ffmpeg/bin/ffmpeg"
          # Passing suites keep their output so the SKIP lines reach the junit report.
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure --output-log ctest.log \
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A suite that QSKIPs still passes, so the failure summary never shows what did not run.
      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage install tree
        run: |
          cmake --install build --prefix "${GITHUB_WORKSPACE}/AppDir/usr" --component drift
          mkdir -p "${GITHUB_WORKSPACE}/dist"

      # linuxdeploy names the AppImage's launcher entry and icon after these, so on the nightly
      # channel they have to be the org.cutwire.Drift.Nightly pair — the desktop file CMake
      # generated at configure time, and a copy of the icon under the matching name (the desktop
      # file's Icon= key and the icon's filename must agree or linuxdeploy rejects it).
      - name: Resolve the desktop entry for the AppImage
        id: appimage_meta
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            icon="${RUNNER_TEMP}/org.cutwire.Drift.Nightly.png"
            cp flatpak/share/icons/hicolor/256x256/apps/org.cutwire.Drift.png "${icon}"
            echo "desktop=build/metadata/org.cutwire.Drift.Nightly.desktop" >> "$GITHUB_OUTPUT"
            echo "icon=${icon}" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=flatpak/org.cutwire.Drift.desktop" >> "$GITHUB_OUTPUT"
            echo "icon=flatpak/share/icons/hicolor/256x256/apps/org.cutwire.Drift.png" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        shell: bash
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage -O linuxdeploy-plugin-qt.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          # The arm64 runner image is not guaranteed to have libfuse2, which the tool AppImages
          # need to mount themselves.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export VERSION="${{ inputs.version }}"
          # Update information for AppImageUpdate and friends: appimagetool embeds it and writes
          # a .zsync next to the AppImage (zsyncmake from apt), which is published alongside it.
          # The .zsync points at the AppImage by basename, so LDAI_OUTPUT has to be the final
          # asset name rather than renaming afterwards.
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY/\//|}|nightly|Drift-nightly-${{ matrix.arch }}.AppImage.zsync"
          else
            export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY/\//|}|latest|Drift-*-${{ matrix.arch }}.AppImage.zsync"
          fi
          export LDAI_OUTPUT="Drift-${{ env.ASSET_LABEL }}-${{ matrix.arch }}.AppImage"
          # Drift's own QML is compiled into the binary, but the Qt Quick modules it imports are
          # not: without QML_SOURCES_PATHS the qt plugin has nothing to scan and ships an AppImage
          # whose every import fails at startup.
          export QML_SOURCES_PATHS="${GITHUB_WORKSPACE}/src/qml"
          # The pinned FFmpeg must come before Qt's lib dir. QtMultimedia ships its own
          # libavcodec.so.61 under the same soname, built with no external codec libraries at all
          # — notably no libdav1d, and FFmpeg's native AV1 decoder is hwaccel-only, so that build
          # cannot decode AV1 in software. With Qt's dir first, linuxdeploy resolved the soname
          # there and shipped it in place of the FFmpeg the binary was built against, leaving AV1
          # playable only on GPUs whose VAAPI/NVDEC covers it and black everywhere else.
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib:${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export EXTRA_PLATFORM_PLUGINS="libqwayland.so"
          # waylandcompositor is the only module whose deployer ships
          # wayland-graphics-integration-client. Without its EGL plugin QtWayland has no client
          # buffer integration, so no OpenGL context can be created on Wayland at all.
          # The plugin splits this list on ';' — a space-separated list matches nothing and
          # silently deploys no extra modules (the 0.6.0 AppImage shipped that way).
          export EXTRA_QT_MODULES="waylandcompositor"
          #
          # The -l lines are libraries dlopened by soname, so linuxdeploy sees no NEEDED entry
          # to follow: OpenSSL is Qt's ossl TLS backend — without it the AppImage ships the
          # cert-only backend and addon downloads have no HTTPS.
          #
          # libva is deliberately NOT bundled, and must not be re-added. AppRun puts usr/lib on
          # LD_LIBRARY_PATH, so a bundled libva.so.2 wins every dlopen and caps VA-API at
          # whatever this runner image ships (22.04: libva 1.14). libva refuses a driver whose
          # VA-API version is newer than its own, so that copy rejects the host's driver on any
          # current distro and hardware decode silently disappears. Resolving from the host is
          # the only version pairing that can be right.
          #
          # A host with no libva at all is handled in code, not here: FFmpeg reaches VA-API
          # through implib-gen stubs whose generated dlopen failure path is assert(0), so
          # hwaccel::deviceAvailable() dlopens libva.so.2 and libva-drm.so.2 itself before
          # letting FFmpeg near VAAPI. See vaapiLoadable() in src/engine/decode/hw/HwAccel.cpp.
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage \
            -d "${{ steps.appimage_meta.outputs.desktop }}" \
            -i "${{ steps.appimage_meta.outputs.icon }}" \
            -e AppDir/usr/bin/drift \
            -l ${{ matrix.libdir }}/libssl.so.3 \
            -l ${{ matrix.libdir }}/libcrypto.so.3
          test -f "${LDAI_OUTPUT}.zsync"
          mv "${LDAI_OUTPUT}" "${LDAI_OUTPUT}.zsync" dist/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync

  windows:
    name: Windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    strategy:
      # Each arch reports its own result: a failing arm64 build should not hide x64's.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            ffmpeg_platform: win64
          # Disabled: vcpkg's skia[gl] is unsupported on arm64-windows.
          # - arch: arm64
          #   runner: windows-11-arm
          #   # Native arm64 host kit: Qt 6.10 ships win64_msvc2022_arm64 for windows_arm64, so
          #   # moc/rcc/qmlcachegen run natively and no desktop host Qt (autodesktop) is needed.
          #   qt_host: windows_arm64
          #   qt_arch: win64_msvc2022_arm64
          #   cmake_arch: ARM64
          #   ffmpeg_platform: winarm64
    steps:
      - uses: actions/checkout@v4

      # fonts/, emoji-fonts/ and the addon effect catalogue are gitignored addon content; the tests
      # need them. Same sparse checkout as tests.yml.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      # The DeepFilterNet3 and Silero VAD weights and the ONNX Runtime are gitignored in Drift-Addons,
      # so they come from the public packages release. Unpacked before the staging copy below, so
      # the copy of drift-addons carries Silero too.
      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p onnxruntime.cpu.win-${{ matrix.arch }}-1.0.0.driftpkg
          python "scripts/unpack-driftpkg.py" "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python "scripts/unpack-driftpkg.py" "$dl/silero.vad-1.0.0.driftpkg" "drift-addons/staging/silero-vad"
          python "scripts/unpack-driftpkg.py" "$dl/onnxruntime.cpu.win-${{ matrix.arch }}-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d models/deepfilternet3
          test -f drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx
          test -f .ort/runtime/lib/onnxruntime.dll

      # Effects resolve through <src>/../drift-addons, which sits outside the workspace where the
      # checkout cannot write, so it is a copy here; the symlink the Linux lanes use needs elevation.
      - name: Stage addon content where the tests expect it
        shell: bash
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts fonts
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font emoji-fonts
          cp -r drift-addons ../drift-addons
          test -f fonts/anton/Anton-400.ttf
          test -f emoji-fonts/HarmonyOS_4.0.ttf
          test -f ../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      # The key covers this workflow too: the package list lives in the install step below, and
      # actions/cache never re-saves on a hit, so a key blind to it would keep serving a cache
      # that predates skia and rebuild it on every run.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}
          restore-keys: |
            vcpkg-bincache-win-${{ matrix.arch }}-

      # zstd (addon package decompression), openssl (addon signature verification), soundtouch
      # (voice-effect pitch shifting) and zlib (the project-file importers' inflate) are the
      # non-Qt, non-FFmpeg libraries Drift links. Windows is the only target with no ambient
      # zlib — every other platform's SDK, base install or runtime already carries one — so it
      # has to be named here or find_package(ZLIB REQUIRED) fails at configure.
      #
      # zlib is installed static-md alongside Skia, not dynamic with the others: Skia's archives
      # link the static-md zlib (zs.lib) themselves, and a second, dynamic zlib (z.lib) in the
      # same executable is a multiply-defined inflate/crc32 (LNK2005). The Configure step hands
      # find_package(ZLIB) that copy by path: zlib 1.3.2 names its static library zs.lib, which
      # the runner's CMake 3.31 FindZLIB does not know (zs joined its name list in a later
      # release), so ZLIB_ROOT alone finds the header and not the library.
      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install zstd openssl soundtouch --triplet ${{ matrix.arch }}-windows
          # Skia comes from vcpkg here rather than third_party/build-skia.sh: the port pins the
          # same Skia commit, and its static build turns Skottie/SVG/SkParagraph on by default.
          # <arch>-windows-static-md, not <arch>-windows: Skottie needs a static Skia
          # (skia_enable_skottie = !is_component_build), and -md keeps the dynamic CRT Qt uses.
          .\vcpkg\vcpkg.exe install zlib "skia[gl,harfbuzz,icu,freetype,png]" --triplet ${{ matrix.arch }}-windows-static-md

      # Save even when a later step fails so the vcpkg build is not repeated on
      # the next run (actions/cache only saves on job success).
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-win-${{ hashFiles('CMakeLists.txt') }}

      # Same pin as the Linux job, and for the same reason — see FFMPEG_TAG above. These DLLs
      # deliberately land on top of the ones windeployqt copies out of Qt.
      - name: Fetch pinned FFmpeg
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .deps\ffmpeg, .deps\ffmpeg_extracted -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .deps\ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:FFMPEG_REPO/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-${{ matrix.ffmpeg_platform }}-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .deps\ffmpeg_extracted -Force
          $extractedRoot = (Get-ChildItem .deps\ffmpeg_extracted)[0].FullName
          Copy-Item -Path "$extractedRoot\*" -Destination .deps\ffmpeg -Recurse -Force

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};${{ github.workspace }}\.deps\ffmpeg;${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md" `
            -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }} `
            -DZLIB_INCLUDE_DIR=${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md\include `
            -DZLIB_LIBRARY=${{ github.workspace }}\vcpkg\installed\${{ matrix.arch }}-windows-static-md\lib\zs.lib `
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF `
            -DDRIFT_BUNDLE_CORE_PACKAGES_ONLY=ON `
            -DDRIFT_WITH_SKIA=ON `
            -DDRIFT_DISTRIBUTION=windows `
            ${{ env.DRIFT_CHANNEL_ARGS }}

      # No --target list any more: the tests have to be built here, and building everything is
      # what also gets tools/ compiled by MSVC. Until this job ran ctest, Windows was the one
      # desktop platform where nothing under tests/ was even known to compile.
      #
      # --parallel 2, not bare --parallel: tst_editorstate compiles AppController.cpp and the
      # whole MCP layer into one translation unit, and on a 4-core/16 GB runner four of those
      # alongside the QML cache TUs exhausted the compiler heap (C1060). The job has a 120
      # minute budget and was failing 15 minutes in, so the headroom is worth more than the
      # wall-clock. Raise it only with evidence from a green run.
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      # Test-only. The runner's Mesa is OpenGL 3.0, so ~110 GPU tests skip; llvmpipe provides 4.5.
      # The DLLs sit beside each test exe because opengl32.dll is in System32 and PATH cannot
      # override it, while the application directory is searched first. Not shipped: Stage runtime
      # files copies only drift.exe and its deploy set, never anything under build\tests.
      # mesa-dist-win ships no arm64 build (the 7z has x64 and x86 only), and an arm64 process
      # cannot load x64 DLLs, so the arm64 lane runs the suite on whatever GL the runner has.
      - name: Install Mesa llvmpipe for the GPU tests
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          MESA_WIN_VERSION: "26.2.4"
        run: |
          $archive = "mesa.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_WIN_VERSION/mesa3d-$env:MESA_WIN_VERSION-release-msvc.7z" -OutFile $archive
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive -omesa -y | Out-Null
          # Only the GL pair: the archive also carries d3d10warp.dll, va.dll and EGL/GLES, which
          # would shadow the system copies the D3D11 and decode tests rely on.
          $dlls = Get-Item mesa\${{ matrix.arch }}\opengl32.dll, mesa\${{ matrix.arch }}\libgallium_wgl.dll
          $testDirs = Get-ChildItem build -Recurse -Filter "tst_*.exe" | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          if (-not $testDirs) { throw "no tst_*.exe under build; the GPU tests would run on the system Mesa" }
          foreach ($dir in $testDirs) {
            Copy-Item $dlls.FullName $dir -Force
          }

      # Visual Studio is a multi-config generator, hence -C Release.
      #
      # .deps\ffmpeg\bin goes on PATH ahead of Qt's: Qt ships its own avcodec/avformat DLLs under
      # the same names, and the suite has to run against the FFmpeg the binaries were built
      # against, not Qt's copy. It also supplies the ffmpeg.exe that the tests which synthesize
      # their clips through QProcess look for.
      #
      # Addon content is staged by a copy rather than the symlink the Linux and macOS lanes use,
      # since creating a symlink outside the workspace needs elevation on Windows.
      #
      # Serial, not ctest -j: the suites share QStandardPaths::AppDataLocation test-mode state.
      #
      # QT_FORCE_STDERR_LOGGING is what makes a failure here legible at all. QPlainTestLogger
      # diverts its whole stream to OutputDebugString when it is writing to stdout and stderr has
      # no console attached (qplaintestlogger.cpp) — which is exactly ctest's pipe. Without it a
      # failing suite reports only "***Failed" with not one FAIL! line to say which case or why,
      # and qWarning/qFatal go the same way, so even a fatal startup error is invisible.
      # GALLIUM_DRIVER selects the llvmpipe copied in by the Mesa step. The ONNX and sticker tests
      # skip without DRIFT_ONNXRUNTIME_DIR and DRIFT_STICKERS_DIR.
      - name: Test
        id: test
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: 1
          GALLIUM_DRIVER: llvmpipe
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\ffmpeg\bin;${{ env.QT_ROOT_DIR }}\bin;$env:PATH"
          # Passing suites keep their output so the SKIP lines reach the junit report.
          ctest --test-dir build -C Release --output-on-failure --output-log ctest.log `
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A suite that QSKIPs still passes, so the failure summary never shows what did not run.
      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item build\Release\drift.exe dist\bin -Force
          # --qmldir: Drift's own QML lives in the binary's resources, but the Qt Quick modules it
          # imports have to be deployed, and qmlimportscanner reads the sources to find them.
          # --no-opengl-sw: opengl32sw.dll is Qt's bundled Mesa llvmpipe, and it only
          # provides OpenGL 3.0 — below the 3.3 the compositor needs. Whenever Qt chose
          # it, Qt Quick came up on it and the preview then stayed black (issue #139),
          # and users were fixing that by deleting the DLL by hand. Do not ship it.
          # app/main.cpp sets QT_NO_OPENGL_BUGLIST so Qt stops picking it over a perfectly
          # good card in the first place; keep the two together.
          & "${{ env.QT_ROOT_DIR }}\bin\windeployqt.exe" --release --no-translations `
            --no-opengl-sw --qmldir src\qml dist\bin\drift.exe
          Copy-Item vcpkg\installed\${{ matrix.arch }}-windows\bin\*.dll dist\bin -Force
          Copy-Item .deps\ffmpeg\bin\*.dll dist\bin -Force
          # Bundled effect/transition/template packages: a POST_BUILD step already put them beside
          # the exe, and the app resolves them relative to it.
          foreach ($dir in "effects", "transitions", "effect-templates", "audio-effects") {
            if (Test-Path "build\Release\$dir") {
              Copy-Item "build\Release\$dir" dist\bin -Recurse -Force
            }
          }

      # The one part of this package that can break silently. QAudioSink gets its devices from Qt's
      # multimedia backend plugin, and the FFmpeg copy above deliberately lands on top of the DLLs
      # windeployqt took out of Qt (see FFMPEG_TAG). If that combination leaves the plugin unable
      # to load, audio playback is silent while video — which uses the FFmpeg Drift links directly
      # — keeps working, so nothing else here would notice.
      #
      # The device count is reported but not asserted: runners have no audio endpoint.
      - name: Verify audio backend
        shell: pwsh
        env:
          QT_DEBUG_PLUGINS: "1"
        run: |
          $pluginRel = "dist\bin\multimedia\ffmpegmediaplugin.dll"
          if (-not (Test-Path $pluginRel)) {
            Get-ChildItem dist\bin\multimedia -ErrorAction SilentlyContinue
            throw "$pluginRel was not deployed; QAudioSink would have no devices at all"
          }
          # Absolute: QPluginLoader otherwise searches libraryPaths() for this string.
          $plugin = (Resolve-Path $pluginRel).Path
          $check = "build\Release\audiobackendcheck.exe"
          if (-not (Test-Path $check)) {
            throw "$check was not built; cannot verify the multimedia backend plugin"
          }
          Copy-Item $check dist\bin -Force
          # Run from the staged tree so the checker's app dir is the same as drift.exe.
          Push-Location dist\bin
          try {
            & .\audiobackendcheck.exe $plugin
            $status = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Remove-Item dist\bin\audiobackendcheck.exe -Force
          if ($status -ne 0) {
            throw "the multimedia backend plugin does not load against the DLLs being shipped"
          }

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.6
        with:
          path: installer/windows/Drift.iss
          # /DNightly gives the installer its own AppId, name and install directory, so it lands
          # beside a stable install rather than upgrading it.
          options: |
            /DMyAppVersion=${{ inputs.version }}
            /DMyAppSource=${{ github.workspace }}\dist\bin
            ${{ matrix.arch == 'arm64' && '/DArm64' || '' }}
            ${{ inputs.channel == 'nightly' && '/DNightly' || '' }}

      # Wildcard rather than a fixed name: the nightly channel's OutputBaseFilename differs, and
      # the script only ever emits one installer.
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $built = Get-ChildItem installer\windows\output\*.exe
          Copy-Item $built.FullName "dist\Drift-Setup-${{ env.ASSET_LABEL }}-${{ matrix.arch }}.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: dist/*.exe

      # The same staged tree the installer wraps, minus the install: a zip holding a single Drift\
      # folder that runs from wherever it is unpacked, touching no registry key and no Start menu.
      # Relocatable, not self-contained — the app still keeps settings, addons, models and caches
      # under %APPDATA%\Drift, so two copies on one machine share that state.
      #
      # 7z rather than Compress-Archive: the staged tree is several hundred MB of Qt and FFmpeg
      # DLLs, which is where Compress-Archive's in-memory approach gets slow.
      # The inner folder is channel-named too, so unpacking both channels side by side does not
      # merge two builds into one directory.
      - name: Build portable zip
        shell: pwsh
        env:
          FOLDER: ${{ inputs.channel == 'nightly' && 'Drift Nightly' || 'Drift' }}
        run: |
          New-Item -ItemType Directory -Force -Path "portable\$env:FOLDER", dist\portable | Out-Null
          Copy-Item dist\bin\* "portable\$env:FOLDER" -Recurse -Force
          & "$env:ProgramFiles\7-Zip\7z.exe" a -tzip -mx=9 `
            "dist\portable\Drift-Portable-${{ env.ASSET_LABEL }}-${{ matrix.arch }}.zip" ".\portable\$env:FOLDER"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ matrix.arch }}
          path: dist/portable/*.zip

  macos:
    name: macOS disk image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    strategy:
      # Separate per-arch images, not a universal one: Homebrew bottles are single-architecture.
      # Each arch reports its own result: a failing x86_64 build should not hide arm64's.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            skia_target: mac-arm64
            ort_pkg: onnxruntime.cpu.osx-arm64-1.0.0.driftpkg
            homebrew_qt: true
          # Homebrew no longer bottles anything for Intel macOS, so its Qt would be built from
          # source (past the 6 h job limit). Intel takes the official Qt and the pinned FFmpeg
          # instead, the way the Windows job does.
          # Disabled: the FFmpeg-Builds n7.1 release has no macos64 asset yet.
          # - arch: x86_64
          #   runner: macos-15-intel
          #   skia_target: mac-x64
          #   ort_pkg: onnxruntime.cpu.osx-x64-1.0.0.driftpkg
          #   homebrew_qt: false
          #   ffmpeg_platform: macos64
    steps:
      - uses: actions/checkout@v4

      # Homebrew, not install-qt-action: its Qt links the same FFmpeg Drift does, so unlike the
      # other jobs there is no second libavcodec in the process to keep ABI-compatible.
      - name: Install dependencies
        if: matrix.homebrew_qt
        run: |
          brew update
          brew install qt ffmpeg zstd openssl@3 sound-touch ninja ccache

      # No brew update: the runner image's formula versions are the ones that still have bottles,
      # and an update would turn every installed formula into a source build.
      - name: Install dependencies (Intel)
        if: ${{ !matrix.homebrew_qt }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install zstd openssl@3 sound-touch ninja ccache

      - name: Install Qt
        if: ${{ !matrix.homebrew_qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      # Built by CutWire-Studios/CI-Builder's ffmpeg-macos64 workflow and mirrored to the n7.1
      # release. Same pin and reason as the Linux and Windows jobs (see FFMPEG_TAG): Qt's FFmpeg
      # backend brings its own libavcodec under the same names.
      - name: Fetch pinned FFmpeg
        if: ${{ !matrix.homebrew_qt }}
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          mkdir -p "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          curl -fsSL "https://github.com/${FFMPEG_REPO}/releases/download/${FFMPEG_TAG}/ffmpeg-${FFMPEG_TAG}-${{ matrix.ffmpeg_platform }}-gpl-shared.tar.xz" \
            | tar -xJf - --strip-components=1 -C "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          test -x "${GITHUB_WORKSPACE}/.deps/ffmpeg/bin/ffmpeg"

      # Same content, same reason, same layout as the tests.yml macOS job.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      - name: Stage addon content where the tests expect it
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts "${GITHUB_WORKSPACE}/fonts"
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font "${GITHUB_WORKSPACE}/emoji-fonts"
          ln -s "${GITHUB_WORKSPACE}/drift-addons" "${GITHUB_WORKSPACE}/../drift-addons"
          test -f "${GITHUB_WORKSPACE}/fonts/anton/family.json"
          test -f "${GITHUB_WORKSPACE}/emoji-fonts/HarmonyOS_4.0.ttf"
          test -f "${GITHUB_WORKSPACE}/../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json"

      # The DeepFilterNet3 and Silero VAD weights and the ONNX Runtime are gitignored in Drift-Addons,
      # so they come from the public packages release. Unpacked where the tests look for them.
      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p ${{ matrix.ort_pkg }}
          python3 scripts/unpack-driftpkg.py "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python3 scripts/unpack-driftpkg.py "$dl/silero.vad-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad"
          python3 scripts/unpack-driftpkg.py "$dl/${{ matrix.ort_pkg }}" "${GITHUB_WORKSPACE}/.ort"
          test -d "${GITHUB_WORKSPACE}/models/deepfilternet3"
          test -f "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx"
          test -f "${GITHUB_WORKSPACE}/.ort/runtime/lib/libonnxruntime.dylib"

      # Homebrew's Qt has no FFmpeg multimedia backend on macOS; the script builds it against the
      # Homebrew Qt and FFmpeg just installed, so the cache is keyed on both versions.
      - name: Resolve Qt FFmpeg plugin cache key
        if: matrix.homebrew_qt
        id: qt-ffmpeg-key
        run: |
          echo "key=v1-qt-ffmpeg-plugin-${{ matrix.arch }}-$(brew list --versions qtmultimedia | awk '{print $NF}')-ffmpeg-$(brew list --versions ffmpeg | awk '{print $NF}')-${{ hashFiles('third_party/build-qt-ffmpeg-plugin.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Qt FFmpeg plugin
        if: matrix.homebrew_qt
        uses: actions/cache@v4
        with:
          path: third_party/prebuilt/qt-ffmpeg-plugin/${{ matrix.arch }}
          key: ${{ steps.qt-ffmpeg-key.outputs.key }}

      - name: Build Qt FFmpeg plugin
        if: matrix.homebrew_qt
        run: third_party/build-qt-ffmpeg-plugin.sh

      # Skia for macOS is compiled here from the pinned commit (Homebrew has no Skia) and cached
      # by script revision. HarfBuzz/ICU/FreeType are compiled in rather than taken from Homebrew,
      # whose versions move under a pinned Skia.
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: third_party/prebuilt/skia/${{ matrix.skia_target }}
          key: v2-skia-${{ matrix.skia_target }}-${{ hashFiles('third_party/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          JOBS="$(sysctl -n hw.ncpu)" third_party/build-skia.sh ${{ matrix.skia_target }}
          rm -rf third_party/src

      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-macos-${{ matrix.arch }}-
          max-size: 700M

      - name: Configure
        run: |
          if [ "${{ matrix.homebrew_qt }}" = true ]; then
            qt_ffmpeg="$(brew --prefix qt)"
          else
            qt_ffmpeg="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/.deps/ffmpeg"
          fi
          cmake -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${qt_ffmpeg};$(brew --prefix openssl@3);$(brew --prefix)" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF \
            -DDRIFT_BUNDLE_CORE_PACKAGES_ONLY=ON \
            -DDRIFT_WITH_SKIA=ON \
            -DDRIFT_DISTRIBUTION=macos \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${DRIFT_CHANNEL_ARGS}

      - name: Build
        id: build
        run: cmake --build build-macos --parallel

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-macos-${{ matrix.arch }}-
          max-size: 700M

      # The ONNX and sticker tests skip without these two; the workspace paths are where the
      # fetch and checkout steps above put the files.
      - name: Test
        id: test
        env:
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        # Passing suites keep their output so the SKIP lines reach the junit report. On Intel the
        # pinned FFmpeg is put ahead of the copy in Qt's lib dir, which has the same install names,
        # and supplies the ffmpeg binary the clip-synthesizing tests run.
        run: |
          if [ "${{ matrix.homebrew_qt }}" != true ]; then
            export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib"
            export PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/bin:${PATH}"
          fi
          ctest --test-dir build-macos --output-on-failure --output-log ctest.log \
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A suite that QSKIPs still passes, so the failure summary never shows what did not run.
      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build-macos/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Signing and notarisation happen only when the secrets are set. Without them — a fork, or
      # any run that cannot see repository secrets — the image is still built and ad-hoc signed.
      # A Developer ID / notary failure must not kill the job either: Apple Silicon still needs a
      # signed binary to launch, so the fallback is the same ad-hoc image a fork would have shipped.
      - name: Build disk image
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          # --channel has to match the Configure step: it is how the script knows the bundle is
          # "Drift Nightly.app" rather than "Drift.app".
          CHANNEL_ARGS=(--channel "${{ inputs.channel }}" --build-id "${{ inputs.build_id }}")
          if [ "${{ matrix.homebrew_qt }}" != true ]; then
            CHANNEL_ARGS+=(--qt-prefix "$QT_ROOT_DIR" --ffmpeg-dir "${GITHUB_WORKSPACE}/.deps/ffmpeg")
          fi

          package_adhoc() {
            scripts/package-macos.sh --build-dir build-macos --skip-build "${CHANNEL_ARGS[@]}"
          }

          if [ -z "$MACOS_CERTIFICATE" ]; then
            package_adhoc
            exit 0
          fi

          # Drop -e for the signed attempt: a codesign / notarytool failure must not abort the
          # step. The subshell keeps -e so the first failure there is the status we inspect.
          set +e
          (
            set -euo pipefail
            ARGS=(--build-dir build-macos --skip-build "${CHANNEL_ARGS[@]}")
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PWD="$(uuidgen)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            # Without this codesign waits on a keychain access prompt nobody can answer.
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
            security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"
            ARGS+=(--identity "$MACOS_SIGN_IDENTITY")

            # Either notarisation credential works; the API key wins when both are set.
            if [ -n "$MACOS_NOTARY_KEY_B64" ]; then
              echo "$MACOS_NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
              export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
              ARGS+=(--notarize)
            elif [ -n "$NOTARY_APPLE_ID" ]; then
              ARGS+=(--notarize)
            fi

            scripts/package-macos.sh "${ARGS[@]}"
          )
          signed_status=$?
          set -euo pipefail

          if [ "$signed_status" -ne 0 ]; then
            echo "::warning::Developer ID signing or notarisation failed; packaging an ad-hoc image instead."
            package_adhoc
          fi

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # The script names it from the project version, which is what a release tag carries; a
      # nightly is renamed to the channel-constant asset name here.
      - name: Name the artifact for this release
        run: |
          want="dist/Drift-${{ env.ASSET_LABEL }}-${{ matrix.arch }}.dmg"
          for f in dist/Drift-*.dmg; do
            [ "$f" = "$want" ] || mv "$f" "$want"
          done

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

  arch:
    name: Arch package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: inputs.platforms == 'all' || inputs.platforms == 'arch'
    strategy:
      # Each arch reports its own result: a failing aarch64 build should not hide x86_64's.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            # Also the ONNX Runtime addon suffix.
            target: linux-x64
          # Disabled: pacman's sandbox (Landlock/alpm user) fails in the Arch Linux ARM container.
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm
          #   target: linux-arm64
    # Arch Linux ARM publishes no Docker image, so on aarch64 the job runs on the bare runner
    # and every step is routed into a container imported from the official rootfs (the
    # "Start Arch Linux ARM container" step) by defaults.run.shell. x86_64 keeps the job-level
    # container, which is why its steps are unchanged.
    container: ${{ matrix.arch == 'x86_64' && 'archlinux:base-devel' || null }}
    defaults:
      run:
        shell: ${{ matrix.arch == 'aarch64' && 'bash scripts/ci/docker-exec-shell.sh {0}' || 'bash -e {0}' }}
    env:
      CI_CONTAINER: archarm
    steps:
      - uses: actions/checkout@v4

      # The rootfs is imported rather than pulled, and the runner's workspace parent (which also
      # holds _temp, where step scripts and $GITHUB_OUTPUT/$GITHUB_STEP_SUMMARY live) is mounted
      # at the same path so every step sees the same files as the host-side actions do.
      - name: Start Arch Linux ARM container
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          curl -fsSL http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz \
            | docker import - archlinuxarm
          docker run -d --name "${CI_CONTAINER}" \
            -v "$(dirname "${RUNNER_WORKSPACE}"):$(dirname "${RUNNER_WORKSPACE}")" \
            archlinuxarm sleep infinity

      # fonts/, emoji-fonts/ and the addon effect catalogue are gitignored addon content; the tests
      # need them. Same sparse checkout as tests.yml.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      # makepkg refuses to run as root, and archlinux:base-devel's default
      # user is root — create an unprivileged builder with passwordless sudo
      # (needed for makepkg -s to pacman-install PKGBUILD's own depends).
      # python is not in base-devel and the nightly PKGBUILD generator needs it before makepkg
      # installs the PKGBUILD's own makedepends.
      - name: Set up builder user
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            # The imported rootfs has an empty keyring. CheckSpace cannot map mount points
            # inside a container and aborts every transaction.
            sed -i 's/^CheckSpace/#CheckSpace/' /etc/pacman.conf
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Syu --noconfirm --needed base-devel sudo
          else
            pacman -Syu --noconfirm
          fi
          pacman -S --needed --noconfirm python noto-fonts zstd
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      # The container has no gh, so these come from the release's public download URLs. The
      # unpacker needs python and zstd, both installed above. Unpacked where the tests look.
      - name: Fetch test models and ONNX Runtime
        run: |
          base="https://github.com/CutWire-Studios/Drift-Addons/releases/download/packages"
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          curl -fsSL -o "$dl/deepfilternet.v3-1.0.0.driftpkg" "$base/deepfilternet.v3-1.0.0.driftpkg"
          curl -fsSL -o "$dl/silero.vad-1.0.0.driftpkg" "$base/silero.vad-1.0.0.driftpkg"
          curl -fsSL -o "$dl/onnxruntime.cpu.${{ matrix.target }}-1.0.0.driftpkg" "$base/onnxruntime.cpu.${{ matrix.target }}-1.0.0.driftpkg"
          python3 scripts/unpack-driftpkg.py "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python3 scripts/unpack-driftpkg.py "$dl/silero.vad-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad"
          python3 scripts/unpack-driftpkg.py "$dl/onnxruntime.cpu.${{ matrix.target }}-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d "${GITHUB_WORKSPACE}/models/deepfilternet3"
          test -f "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx"
          test -f "${GITHUB_WORKSPACE}/.ort/runtime/lib/libonnxruntime.so"

      # Arch is the one platform where the two channels are not co-installable — both packages
      # own /usr/bin/drift — so the nightly takes a distinct package name and declares the
      # conflict, the way an AUR -git package does. The PKGBUILD is derived from the stable one
      # at build time rather than committed, so a new dependency there cannot be missed here.
      - name: Generate the nightly PKGBUILD
        if: inputs.channel == 'nightly'
        run: |
          scripts/make-nightly-pkgbuild.sh "${{ inputs.build_id }}" "${{ github.sha }}"
          chown -R builder:builder packaging/arch/nightly

      # The PKGBUILD's source is git+https with a #commit= pin that defaults
      # to the latest tagged release (so a plain `makepkg` — e.g. a real AUR
      # build — stays reproducible), but it reads _commit from the
      # environment first, so pin it to the exact commit that triggered this
      # workflow instead of the tag.
      - name: Build package
        id: build
        env:
          PKGDIR: ${{ inputs.channel == 'nightly' && 'packaging/arch/nightly' || 'packaging/arch' }}
        # Extract first, then drop the addon fonts into the extracted tree for check() and
        # build without re-extracting.
        run: |
          su builder -c "cd '${GITHUB_WORKSPACE}/${PKGDIR}' && _commit='${{ github.sha }}' makepkg -so --noconfirm"
          SRC="$(echo "${GITHUB_WORKSPACE}/${PKGDIR}"/src/drift*/)"
          cp -r drift-addons/staging/fonts-essentials/fonts "${SRC}fonts"
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font "${SRC}emoji-fonts"
          # The tests resolve <src>/models and <src>/../drift-addons, the latter being the sibling
          # of the extracted tree, so the copies go to the same places the tests look.
          mkdir -p "${SRC}models"
          cp -r models/deepfilternet3 "${SRC}models/deepfilternet3"
          cp -r drift-addons "${SRC}../drift-addons"
          chown -R builder:builder "${SRC}" "${SRC}../drift-addons" "${GITHUB_WORKSPACE}/.ort"
          su builder -c "cd '${GITHUB_WORKSPACE}/${PKGDIR}' && _commit='${{ github.sha }}' DRIFT_ONNXRUNTIME_DIR='${GITHUB_WORKSPACE}/.ort/runtime' DRIFT_STICKERS_DIR='${GITHUB_WORKSPACE}/drift-addons/staging/stickers-harmonyos/stickers' makepkg -se --noconfirm"

      # A suite that QSKIPs still passes, so check() never shows what did not run. makepkg
      # extracts into src/$pkgname, which is drift or drift-nightly.
      - name: Summarize skipped tests
        if: always() && steps.build.outcome != 'skipped'
        shell: bash
        env:
          PKGDIR: ${{ inputs.channel == 'nightly' && 'packaging/arch/nightly' || 'packaging/arch' }}
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' "${PKGDIR}"/src/drift*/build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # makepkg's own filename carries the version, which for a nightly changes every night and
      # would leave the previous night's asset behind on the one rewritten pre-release. Stable
      # keeps the name pacman users expect.
      - name: Collect package
        env:
          PKGDIR: ${{ inputs.channel == 'nightly' && 'packaging/arch/nightly' || 'packaging/arch' }}
        run: |
          mkdir -p dist
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            cp "${PKGDIR}"/*.pkg.tar.zst dist/drift-nightly-${{ matrix.arch }}.pkg.tar.zst
          else
            cp "${PKGDIR}"/*.pkg.tar.zst dist/
          fi

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst

      - name: Hand the workspace back to the runner user
        if: always() && matrix.arch == 'aarch64'
        shell: bash
        run: docker exec "${CI_CONTAINER}" chown -R "$(id -u):$(id -g)" "$(dirname "${RUNNER_WORKSPACE}")"

  # Multi-ABI APKs. Push-time compile coverage is android.yml (arm64, no packaging); this job is
  # what build.yml and release.yml call for installable artifacts.
  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    strategy:
      # Every ABI reports its own result: one failing arch should not hide whether the
      # other two compile.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          # Qt names the 32-bit ARM kit after the architecture, not after the Android ABI.
          - abi: armeabi-v7a
            qt_arch: android_armv7
          - abi: x86_64
            qt_arch: android_x86_64

    env:
      ABI: ${{ matrix.abi }}
      # Android kit Qt version — independent of the desktop QT_VERSION above. scripts/build.sh
      # pins the same number.
      QT_ANDROID_VERSION: 6.11.1
      # qtshadertools builds the QuickEffects shaders; qtimageformats supplies the qwebp and qtiff
      # plugins. Those plugins have no link-time reference, so nothing in the build fails without
      # them — androiddeployqt simply bundles no qwebp and every .webp/.tiff still decodes to a null
      # QImage on device. Keep this in sync with QT_MODULES for the desktop jobs.
      QT_ANDROID_MODULES: "qtmultimedia qtshadertools qtimageformats"
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf "$ANDROID_SDK_ROOT"/ndk
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve SDK and NDK paths
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm meson pkg-config ccache \
            libgl1 libegl1 libxkbcommon0 libfontconfig1

      - name: Install Android NDK ${{ env.NDK_VERSION }} and SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Qt ${{ env.QT_ANDROID_VERSION }} (host + Android)
        run: |
          pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop "$QT_ANDROID_VERSION" linux_gcc_64 \
            -m $QT_ANDROID_MODULES -O "$HOME/Qt"
          aqt install-qt all_os android "$QT_ANDROID_VERSION" "${{ matrix.qt_arch }}" \
            -m $QT_ANDROID_MODULES -O "$HOME/Qt"
          # Qt builds each Android kit on whichever host it happens to use — the ARMv7 one comes
          # from a Windows machine, and that 7z carries no POSIX permission bits, so every script
          # in the kit extracts non-executable and scripts/build.sh finds no runnable qt-cmake.
          KIT="$HOME/Qt/$QT_ANDROID_VERSION/${{ matrix.qt_arch }}"
          find "$KIT/bin" "$KIT/libexec" -maxdepth 1 -type f ! -name '*.bat' -exec chmod +x {} +

      - name: Restore prebuilt native dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prebuilt
          key: v2-android-deps-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('third_party/build-android.sh', 'third_party/build-skia.sh') }}

      # Two scripts, one cache: both install under third_party/prebuilt, so a change to either
      # rebuilds both. Skia cross-compiles with the NDK's clang and carries its own HarfBuzz, ICU,
      # FreeType, expat, libpng and zlib — there are no system libraries on Android to lean on.
      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          ./third_party/build-android.sh "$ABI"
          JOBS="$(nproc)" ./third_party/build-skia.sh "android-$ABI"

      - name: Save prebuilt native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prebuilt
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Drop native dependency sources
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf third_party/src

      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-android-${{ matrix.abi }}-
          max-size: 700M

      # versionName comes from CMake PROJECT_VERSION (same as desktop). versionCode: release
      # builds leave it unset so CMake derives major*10000+minor*100+patch; CI side-loads and
      # nightlies use run_number, which is monotonic, so each new build replaces the previous
      # install under its own package id rather than the release one.
      - name: Resolve Android package identity
        id: identity
        shell: bash
        run: |
          case "${{ inputs.android_identity }}" in
            release)
              echo "package=org.cutwire.drift" >> "$GITHUB_OUTPUT"
              echo "app_name=Drift" >> "$GITHUB_OUTPUT"
              echo "version_code=" >> "$GITHUB_OUTPUT"
              ;;
            nightly)
              echo "package=org.cutwire.drift.nightly" >> "$GITHUB_OUTPUT"
              echo "app_name=Drift Nightly" >> "$GITHUB_OUTPUT"
              echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "package=org.cutwire.drift.ci" >> "$GITHUB_OUTPUT"
              echo "app_name=Drift CI" >> "$GITHUB_OUTPUT"
              echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build release APK
        id: build
        env:
          DRIFT_ANDROID_PACKAGE_NAME: ${{ steps.identity.outputs.package }}
          DRIFT_ANDROID_APP_NAME: ${{ steps.identity.outputs.app_name }}
          DRIFT_ANDROID_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          DRIFT_CHANNEL: ${{ inputs.channel }}
          DRIFT_BUILD_ID: ${{ inputs.build_id }}
          DRIFT_DISTRIBUTION: android-github
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export QT_ANDROID_ROOT="$HOME/Qt/$QT_ANDROID_VERSION/${{ matrix.qt_arch }}"
          export QT_HOST_PATH="$HOME/Qt/$QT_ANDROID_VERSION/gcc_64"
          # Empty VERSION_CODE must not reach the environment as "", which would still override
          # CMake's derived default — unset it instead.
          if [ -z "${DRIFT_ANDROID_VERSION_CODE}" ]; then
            unset DRIFT_ANDROID_VERSION_CODE
          fi
          ./scripts/build.sh "$ABI" Release

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-android-${{ matrix.abi }}-
          max-size: 700M

      - name: Collect and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABI: ${{ matrix.abi }}
          VERSION: ${{ env.ASSET_LABEL }}
        run: |
          set -euo pipefail
          BUILD="build/android-$ABI"
          APK="$(find "$BUILD/android-build/build/outputs/apk/release" -name '*.apk' -print -quit 2>/dev/null || true)"
          [ -n "$APK" ] || APK="$(find "$BUILD/android-build" -name '*release*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no release APK under $BUILD/android-build" >&2; exit 1; }

          mkdir -p dist
          OUT="dist/Drift-${VERSION}-${ABI}.apk"

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; uploading unsigned APK"
            cp "$APK" "$OUT"
            exit 0
          fi

          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$KS"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.abi }}
          path: dist/Drift-${{ env.ASSET_LABEL }}-${{ matrix.abi }}.apk
          if-no-files-found: error
