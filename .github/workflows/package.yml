name: Package

# The one place every platform build is defined. Both callers — build.yml (manual, unversioned)
# and release.yml (tag-triggered, publishes) — reuse this so a fix to a build never has to be
# applied twice.
on:
  workflow_call:
    inputs:
      version:
        description: "Version string baked into artifact names"
        required: true
        type: string
      platforms:
        description: "all, flatpak, linux, windows, macos, arch or android"
        required: false
        default: all
        type: string
      android_identity:
        description: "release (org.cutwire.drift) or ci (org.cutwire.drift.ci) package id"
        required: false
        default: ci
        type: string

permissions:
  contents: read

env:
  QT_VERSION: "6.10.3"
  # Drift needs Quick, QuickControls2, QuickEffects, Widgets, OpenGL, Network, Concurrent and Test
  # (qtbase + qtdeclarative, both in the base install); qtmultimedia is the only extra it links.
  # qtimageformats is for the import side: without it webp/tiff stills cannot be added to a project.
  # LinguistTools (lupdate) ships in the default qttools archive — it is not an aqtinstall module.
  QT_MODULES: >-
    qtmultimedia
    qtimageformats
  # Deliberately not QT_QPA_PLATFORM=offscreen: that plugin cannot create an OpenGL context on a
  # runner with no /dev/dri, so every compositor test renders a null QImage. Mesa is not the
  # problem — llvmpipe works fine once there is an X server, so the test steps run under Xvfb on
  # the xcb plugin instead. See the Test step below.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  # Pinned to the FFmpeg *branch* QtMultimedia's ffmpeg backend bundles for QT_VERSION above (check
  # doc.qt.io/qt-6/qtmultimedia-attribution-ffmpeg.html when bumping QT_VERSION). Drift links
  # FFmpeg itself *and* loads Qt's multimedia backend for audio output, so both copies are in the
  # process; sharing a branch is what keeps that from being two ABIs of the same library.
  #
  # Hosted on CutWire-Studios/FFmpeg-Builds rather than BtbN's moving `latest` tag: BtbN dropped
  # n7.1 from latest on 2026-08-17 (they now ship n8.1 / n9.0), and their dated autobuild tags are
  # deleted after ~2 weeks. The n7.1 release on our fork is a stable URL for this soversion.
  #
  # The gpl variant, not lgpl: x264 and x265 are GPL, so the lgpl builds carry no H.264/H.265
  # encoder at all — which leaves the default export settings unencodable and MatteWriter with
  # nothing to write a matte with. Drift is GPLv3 (see LICENSE), so linking them is fine.
  FFMPEG_REPO: "CutWire-Studios/FFmpeg-Builds"
  FFMPEG_TAG: "n7.1"

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    if: inputs.platforms == 'all' || inputs.platforms == 'flatpak'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner image adds packages.microsoft.com; azure-cli.list is the one *microsoft* misses.
          # GitHub's apt-mirrors.txt tries azure.archive then archive.ubuntu.com; both stall.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          printf '%s\n' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
            'Acquire::Retries "2";' 'APT::Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          {
            curl -fsSL --max-time 8 http://mirrors.ubuntu.com/mirrors.txt || true
            echo "http://us.archive.ubuntu.com/ubuntu/"
            echo "http://security.ubuntu.com/ubuntu/"
          } | sed 's:/*$:/:' \
            | grep -vi 'azure.archive.ubuntu.com' \
            | grep -viE '^https?://archive\.ubuntu\.com/' \
            | awk 'NF && !seen[$0]++' \
            | awk '{ printf "%s\tpriority:%d\n", $0, NR }' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Lint flatpak manifest and metadata
        run: |
          appstreamcli validate --no-net flatpak/org.cutwire.Drift.metainfo.xml
          desktop-file-validate flatpak/org.cutwire.Drift.desktop
          flatpak-builder --show-manifest flatpak/org.cutwire.Drift.yml > /dev/null
          flatpak-builder --show-manifest flatpak/org.cutwire.Drift.flathub.yml > /dev/null

      - name: Cache flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ hashFiles('flatpak/org.cutwire.Drift.yml') }}

      # The local manifest (not the Flathub one) — it builds the working tree, so it validates the
      # commit under test rather than whatever tag the Flathub manifest is pinned to.
      - name: Build flatpak
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo="${{ runner.temp }}/flatpak-repo" \
            "${{ runner.temp }}/flatpak-build" \
            flatpak/org.cutwire.Drift.yml

      - name: Export bundle
        run: |
          mkdir -p dist
          flatpak build-bundle "${{ runner.temp }}/flatpak-repo" \
            "dist/Drift-${{ inputs.version }}.flatpak" \
            org.cutwire.Drift

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: dist/*.flatpak

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # cmake is deliberately not installed from apt: the runner image already carries a newer one
      # on PATH and apt's would only add ambiguity.
      # libva* are runtime, not build, deps: FFmpeg reaches VA-API through implib-gen stubs
      # whose generated dlopen failure path is assert(0). hwaccel::deviceAvailable() now
      # guards that, so their absence no longer SIGABRTs — they stay so the tests probe VAAPI
      # for real instead of taking the guard's early-out on every run.
      - name: Install native build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Runner image adds packages.microsoft.com; azure-cli.list is the one *microsoft* misses.
          # GitHub's apt-mirrors.txt tries azure.archive then archive.ubuntu.com; both stall.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          printf '%s\n' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
            'Acquire::Retries "2";' 'APT::Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          {
            curl -fsSL --max-time 8 http://mirrors.ubuntu.com/mirrors.txt || true
            echo "http://us.archive.ubuntu.com/ubuntu/"
            echo "http://security.ubuntu.com/ubuntu/"
          } | sed 's:/*$:/:' \
            | grep -vi 'azure.archive.ubuntu.com' \
            | grep -viE '^https?://archive\.ubuntu\.com/' \
            | awk 'NF && !seen[$0]++' \
            | awk '{ printf "%s\tpriority:%d\n", $0, NR }' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            build-essential ninja-build pkg-config git xvfb \
            libgl1-mesa-dev libegl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libzstd-dev libssl-dev libsoundtouch-dev \
            libpulse-dev libasound2-dev \
            libva2 libva-drm2 libva-x11-2 \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-cursor-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Fetch pinned FFmpeg
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          mkdir -p "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          curl -fsSL "https://github.com/${FFMPEG_REPO}/releases/download/${FFMPEG_TAG}/ffmpeg-${FFMPEG_TAG}-linux64-gpl-shared.tar.xz" \
            | tar -xJf - --strip-components=1 -C "${GITHUB_WORKSPACE}/.deps/ffmpeg"

      # DRIFT_BUNDLE_ONNXRUNTIME=OFF: a packaged build ships no runtime at all. Drift dlopens the
      # one the user installs from the Acceleration category, which is what keeps the CPU / CUDA /
      # WebGPU choice theirs instead of the packager's. Only the headers are fetched, to compile.
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/.deps/ffmpeg" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF

      - name: Build
        run: cmake --build build --parallel

      # The same command the README documents. Xvfb is what makes the GPU tests real here: only
      # some of them guard on GpuEffectExecutor::isAvailable() and QSKIP, the rest compare against
      # whatever the compositor returned, which is a null QImage when there is no GL context.
      # Models and font bundles that are not in the repo do skip themselves.
      #
      # LD_LIBRARY_PATH is prepended rather than appended: install-qt-action puts Qt's lib dir on
      # it, and QtMultimedia ships its own libavcodec.so.61 under the same soname, built with no
      # external codec libraries. Appending let that copy win, so the suite exercised an FFmpeg
      # the app was never built against and never ships. Prepending also still supplies
      # libpostproc.so.58, which only the gpl FFmpeg ships (postproc is GPL-only) and which
      # libavfilter needs: CMake gives the test binaries a build RPATH covering that directory,
      # but emits it as DT_RUNPATH, and the loader applies RUNPATH only to the binary's own NEEDED
      # entries — never to a dependency's. libavfilter carries no RUNPATH of its own, so nothing
      # found libpostproc.
      - name: Test
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

      - name: Stage install tree
        run: |
          cmake --install build --prefix "${GITHUB_WORKSPACE}/AppDir/usr" --component drift
          mkdir -p "${GITHUB_WORKSPACE}/dist"

      - name: Build AppImage
        shell: bash
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export VERSION="${{ inputs.version }}"
          # Drift's own QML is compiled into the binary, but the Qt Quick modules it imports are
          # not: without QML_SOURCES_PATHS the qt plugin has nothing to scan and ships an AppImage
          # whose every import fails at startup.
          export QML_SOURCES_PATHS="${GITHUB_WORKSPACE}/src/qml"
          # The pinned FFmpeg must come before Qt's lib dir. QtMultimedia ships its own
          # libavcodec.so.61 under the same soname, built with no external codec libraries at all
          # — notably no libdav1d, and FFmpeg's native AV1 decoder is hwaccel-only, so that build
          # cannot decode AV1 in software. With Qt's dir first, linuxdeploy resolved the soname
          # there and shipped it in place of the FFmpeg the binary was built against, leaving AV1
          # playable only on GPUs whose VAAPI/NVDEC covers it and black everywhere else.
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib:${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export EXTRA_PLATFORM_PLUGINS="libqwayland.so"
          # waylandclient as well as waylandcompositor: the client half is what brings
          # wayland-graphics-integration-client, and without its EGL plugin QtWayland
          # cannot hand out an offscreen surface — the compositor then falls back to a
          # hidden QWindow it is not allowed to create off the GUI thread, and the
          # preview goes black on Wayland while X11 is fine.
          export EXTRA_QT_MODULES="waylandcompositor waylandclient"
          #
          # The -l lines are libraries dlopened by soname, so linuxdeploy sees no NEEDED entry
          # to follow: OpenSSL is Qt's ossl TLS backend — without it the AppImage ships the
          # cert-only backend and addon downloads have no HTTPS.
          #
          # libva is deliberately NOT bundled, and must not be re-added. AppRun puts usr/lib on
          # LD_LIBRARY_PATH, so a bundled libva.so.2 wins every dlopen and caps VA-API at
          # whatever this runner image ships (22.04: libva 1.14). libva refuses a driver whose
          # VA-API version is newer than its own, so that copy rejects the host's driver on any
          # current distro and hardware decode silently disappears. Resolving from the host is
          # the only version pairing that can be right.
          #
          # A host with no libva at all is handled in code, not here: FFmpeg reaches VA-API
          # through implib-gen stubs whose generated dlopen failure path is assert(0), so
          # hwaccel::deviceAvailable() dlopens libva.so.2 and libva-drm.so.2 itself before
          # letting FFmpeg near VAAPI. See vaapiLoadable() in src/engine/HwAccel.cpp.
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage \
            -d flatpak/org.cutwire.Drift.desktop \
            -i flatpak/share/icons/hicolor/256x256/apps/org.cutwire.Drift.png \
            -e AppDir/usr/bin/drift \
            -l /usr/lib/x86_64-linux-gnu/libssl.so.3 \
            -l /usr/lib/x86_64-linux-gnu/libcrypto.so.3
          appimage="$(ls ./*.AppImage | grep -iv linuxdeploy | head -n 1)"
          mv "${appimage}" "dist/Drift-${{ inputs.version }}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows:
    name: Windows installer
    runs-on: windows-2022
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-bincache-win-

      # zstd (addon package decompression), openssl (addon signature verification) and soundtouch
      # (voice-effect pitch shifting) are the three non-Qt, non-FFmpeg libraries Drift links. All
      # three ship a CMake config here, which is what lets the MSVC build work with no pkg-config.
      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install zstd openssl soundtouch --triplet x64-windows

      # Save even when a later step fails so the vcpkg build is not repeated on
      # the next run (actions/cache only saves on job success).
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-win-${{ hashFiles('CMakeLists.txt') }}

      # Same pin as the Linux job, and for the same reason — see FFMPEG_TAG above. These DLLs
      # deliberately land on top of the ones windeployqt copies out of Qt.
      - name: Fetch pinned FFmpeg
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .deps\ffmpeg, .deps\ffmpeg_extracted -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .deps\ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:FFMPEG_REPO/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .deps\ffmpeg_extracted -Force
          $extractedRoot = (Get-ChildItem .deps\ffmpeg_extracted)[0].FullName
          Copy-Item -Path "$extractedRoot\*" -Destination .deps\ffmpeg -Recurse -Force

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};${{ github.workspace }}\.deps\ffmpeg" `
            -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }} `
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target drift audiobackendcheck --parallel

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item build\Release\drift.exe dist\bin -Force
          # --qmldir: Drift's own QML lives in the binary's resources, but the Qt Quick modules it
          # imports have to be deployed, and qmlimportscanner reads the sources to find them.
          # --no-opengl-sw: opengl32sw.dll is Qt's bundled Mesa llvmpipe, and it only
          # provides OpenGL 3.0 — below the 3.3 the compositor needs. Whenever Qt chose
          # it, Qt Quick came up on it and the preview then stayed black (issue #139),
          # and users were fixing that by deleting the DLL by hand. Do not ship it.
          # main.cpp sets QT_NO_OPENGL_BUGLIST so Qt stops picking it over a perfectly
          # good card in the first place; keep the two together.
          & "${{ env.QT_ROOT_DIR }}\bin\windeployqt.exe" --release --no-translations `
            --no-opengl-sw --qmldir src\qml dist\bin\drift.exe
          Copy-Item vcpkg\installed\x64-windows\bin\*.dll dist\bin -Force
          Copy-Item .deps\ffmpeg\bin\*.dll dist\bin -Force
          # Bundled effect/transition/template packages: a POST_BUILD step already put them beside
          # the exe, and the app resolves them relative to it.
          foreach ($dir in "effects", "transitions", "effect-templates", "audio-effects") {
            Copy-Item "build\Release\$dir" dist\bin -Recurse -Force
          }

      # The one part of this package that can break silently. QAudioSink gets its devices from Qt's
      # multimedia backend plugin, and the FFmpeg copy above deliberately lands on top of the DLLs
      # windeployqt took out of Qt (see FFMPEG_TAG). If that combination leaves the plugin unable
      # to load, audio playback is silent while video — which uses the FFmpeg Drift links directly
      # — keeps working, so nothing else here would notice.
      #
      # The device count is reported but not asserted: runners have no audio endpoint.
      - name: Verify audio backend
        shell: pwsh
        env:
          QT_DEBUG_PLUGINS: "1"
        run: |
          $pluginRel = "dist\bin\multimedia\ffmpegmediaplugin.dll"
          if (-not (Test-Path $pluginRel)) {
            Get-ChildItem dist\bin\multimedia -ErrorAction SilentlyContinue
            throw "$pluginRel was not deployed; QAudioSink would have no devices at all"
          }
          # Absolute: QPluginLoader otherwise searches libraryPaths() for this string.
          $plugin = (Resolve-Path $pluginRel).Path
          $check = "build\Release\audiobackendcheck.exe"
          if (-not (Test-Path $check)) {
            throw "$check was not built; cannot verify the multimedia backend plugin"
          }
          Copy-Item $check dist\bin -Force
          # Run from the staged tree so the checker's app dir is the same as drift.exe.
          Push-Location dist\bin
          try {
            & .\audiobackendcheck.exe $plugin
            $status = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          Remove-Item dist\bin\audiobackendcheck.exe -Force
          if ($status -ne 0) {
            throw "the multimedia backend plugin does not load against the DLLs being shipped"
          }

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.6
        with:
          path: installer/windows/Drift.iss
          options: |
            /DMyAppVersion=${{ inputs.version }}
            /DMyAppSource=${{ github.workspace }}\dist\bin

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item installer\windows\output\Drift-Setup-x64.exe `
            "dist\Drift-Setup-${{ inputs.version }}-x64.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

      # The same staged tree the installer wraps, minus the install: a zip holding a single Drift\
      # folder that runs from wherever it is unpacked, touching no registry key and no Start menu.
      # Relocatable, not self-contained — the app still keeps settings, addons, models and caches
      # under %APPDATA%\Drift, so two copies on one machine share that state.
      #
      # 7z rather than Compress-Archive: the staged tree is several hundred MB of Qt and FFmpeg
      # DLLs, which is where Compress-Archive's in-memory approach gets slow.
      - name: Build portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable\Drift, dist\portable | Out-Null
          Copy-Item dist\bin\* portable\Drift -Recurse -Force
          & "$env:ProgramFiles\7-Zip\7z.exe" a -tzip -mx=9 `
            "dist\portable\Drift-Portable-${{ inputs.version }}-x64.zip" .\portable\Drift

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/portable/*.zip

  macos:
    name: macOS disk image
    # Apple Silicon only: Homebrew bottles are single-architecture.
    runs-on: macos-15
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Homebrew, not install-qt-action: its Qt links the same FFmpeg Drift does, so unlike the
      # other jobs there is no second libavcodec in the process to keep ABI-compatible.
      - name: Install dependencies
        run: |
          brew update
          brew install qt ffmpeg zstd openssl@3 sound-touch ninja

      - name: Configure
        run: |
          cmake -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix openssl@3);$(brew --prefix)" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF

      - name: Build
        run: cmake --build build-macos --parallel

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      # Signing and notarisation happen only when the secrets are set. Without them — a fork, or
      # any run that cannot see repository secrets — the image is still built and ad-hoc signed.
      # A Developer ID / notary failure must not kill the job either: Apple Silicon still needs a
      # signed binary to launch, so the fallback is the same ad-hoc image a fork would have shipped.
      - name: Build disk image
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          package_adhoc() {
            scripts/package-macos.sh --build-dir build-macos --skip-build
          }

          if [ -z "$MACOS_CERTIFICATE" ]; then
            package_adhoc
            exit 0
          fi

          # Drop -e for the signed attempt: a codesign / notarytool failure must not abort the
          # step. The subshell keeps -e so the first failure there is the status we inspect.
          set +e
          (
            set -euo pipefail
            ARGS=(--build-dir build-macos --skip-build)
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PWD="$(uuidgen)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            # Without this codesign waits on a keychain access prompt nobody can answer.
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
            security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"
            ARGS+=(--identity "$MACOS_SIGN_IDENTITY")

            # Either notarisation credential works; the API key wins when both are set.
            if [ -n "$MACOS_NOTARY_KEY_B64" ]; then
              echo "$MACOS_NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
              export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
              ARGS+=(--notarize)
            elif [ -n "$NOTARY_APPLE_ID" ]; then
              ARGS+=(--notarize)
            fi

            scripts/package-macos.sh "${ARGS[@]}"
          )
          signed_status=$?
          set -euo pipefail

          if [ "$signed_status" -ne 0 ]; then
            echo "::warning::Developer ID signing or notarisation failed; packaging an ad-hoc image instead."
            package_adhoc
          fi

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # The script already names it from the project version, which is what a release tag carries.
      - name: Name the artifact for this release
        run: |
          want="dist/Drift-${{ inputs.version }}-arm64.dmg"
          for f in dist/Drift-*.dmg; do
            [ "$f" = "$want" ] || mv "$f" "$want"
          done

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    if: inputs.platforms == 'all' || inputs.platforms == 'arch'
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      # makepkg refuses to run as root, and archlinux:base-devel's default
      # user is root — create an unprivileged builder with passwordless sudo
      # (needed for makepkg -s to pacman-install PKGBUILD's own depends).
      - name: Set up builder user
        run: |
          pacman -Syu --noconfirm
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      # The PKGBUILD's source is git+https with a #commit= pin that defaults
      # to the latest tagged release (so a plain `makepkg` — e.g. a real AUR
      # build — stays reproducible), but it reads _commit from the
      # environment first, so pin it to the exact commit that triggered this
      # workflow instead of the tag.
      - name: Build package
        run: su builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch' && _commit='${{ github.sha }}' makepkg -s --noconfirm"

      - name: Collect package
        run: |
          mkdir -p dist
          cp packaging/arch/*.pkg.tar.zst dist/

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  # Multi-ABI APKs. Push-time compile coverage is android.yml (arm64, no packaging); this job is
  # what build.yml and release.yml call for installable artifacts.
  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    timeout-minutes: 240
    strategy:
      # Every ABI reports its own result: one failing arch should not hide whether the
      # other two compile.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          # Qt names the 32-bit ARM kit after the architecture, not after the Android ABI.
          - abi: armeabi-v7a
            qt_arch: android_armv7
          - abi: x86_64
            qt_arch: android_x86_64

    env:
      ABI: ${{ matrix.abi }}
      # Android kit Qt version — independent of the desktop QT_VERSION above. scripts/build.sh
      # pins the same number.
      QT_ANDROID_VERSION: 6.11.1
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf "$ANDROID_SDK_ROOT"/ndk
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve SDK and NDK paths
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm meson pkg-config ccache \
            libgl1 libegl1 libxkbcommon0 libfontconfig1

      - name: Install Android NDK ${{ env.NDK_VERSION }} and SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Qt ${{ env.QT_ANDROID_VERSION }} (host + Android)
        run: |
          pipx install aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop "$QT_ANDROID_VERSION" linux_gcc_64 \
            -m qtmultimedia qtshadertools -O "$HOME/Qt"
          aqt install-qt all_os android "$QT_ANDROID_VERSION" "${{ matrix.qt_arch }}" \
            -m qtmultimedia qtshadertools -O "$HOME/Qt"
          # Qt builds each Android kit on whichever host it happens to use — the ARMv7 one comes
          # from a Windows machine, and that 7z carries no POSIX permission bits, so every script
          # in the kit extracts non-executable and scripts/build.sh finds no runnable qt-cmake.
          KIT="$HOME/Qt/$QT_ANDROID_VERSION/${{ matrix.qt_arch }}"
          find "$KIT/bin" "$KIT/libexec" -maxdepth 1 -type f ! -name '*.bat' -exec chmod +x {} +

      - name: Restore prebuilt native dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/prebuilt
          key: android-deps-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('third_party/build-android.sh') }}

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./third_party/build-android.sh "$ABI"

      - name: Save prebuilt native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/prebuilt
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Drop native dependency sources
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf third_party/src

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: ccache-android-${{ matrix.abi }}-

      # versionName comes from CMake PROJECT_VERSION (same as desktop). versionCode: release
      # builds leave it unset so CMake derives major*10000+minor*100+patch; CI side-loads use
      # run_number so each dry-run can replace the previous install under the .ci package id.
      - name: Resolve Android package identity
        id: identity
        shell: bash
        run: |
          if [ "${{ inputs.android_identity }}" = "release" ]; then
            echo "package=org.cutwire.drift" >> "$GITHUB_OUTPUT"
            echo "app_name=Drift" >> "$GITHUB_OUTPUT"
            echo "version_code=" >> "$GITHUB_OUTPUT"
          else
            echo "package=org.cutwire.drift.ci" >> "$GITHUB_OUTPUT"
            echo "app_name=Drift CI" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          DRIFT_ANDROID_PACKAGE_NAME: ${{ steps.identity.outputs.package }}
          DRIFT_ANDROID_APP_NAME: ${{ steps.identity.outputs.app_name }}
          DRIFT_ANDROID_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        run: |
          export QT_ANDROID_ROOT="$HOME/Qt/$QT_ANDROID_VERSION/${{ matrix.qt_arch }}"
          export QT_HOST_PATH="$HOME/Qt/$QT_ANDROID_VERSION/gcc_64"
          # Empty VERSION_CODE must not reach the environment as "", which would still override
          # CMake's derived default — unset it instead.
          if [ -z "${DRIFT_ANDROID_VERSION_CODE}" ]; then
            unset DRIFT_ANDROID_VERSION_CODE
          fi
          ./scripts/build.sh "$ABI" Release
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ matrix.abi }}-${{ github.sha }}

      - name: Collect and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABI: ${{ matrix.abi }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BUILD="build/android-$ABI"
          APK="$(find "$BUILD/android-build/build/outputs/apk/release" -name '*.apk' -print -quit 2>/dev/null || true)"
          [ -n "$APK" ] || APK="$(find "$BUILD/android-build" -name '*release*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "no release APK under $BUILD/android-build" >&2; exit 1; }

          mkdir -p dist
          OUT="dist/Drift-${VERSION}-${ABI}.apk"

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; uploading unsigned APK"
            cp "$APK" "$OUT"
            exit 0
          fi

          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$KS"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.abi }}
          path: dist/Drift-${{ inputs.version }}-${{ matrix.abi }}.apk
          if-no-files-found: error
