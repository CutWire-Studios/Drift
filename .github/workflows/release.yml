name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(grep -oP '^project\(Drift VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [ "${tag_version}" != "${cmake_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match CMakeLists.txt's project version (${cmake_version})"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check the Arch package version matches too
        shell: bash
        run: |
          pkgver="$(grep -oP '^pkgver=\K.*' packaging/arch/PKGBUILD)"
          if [ "${pkgver}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packaging/arch/PKGBUILD pkgver=${pkgver} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check Flatpak release notes exist for this version
        run: python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release notes
        run: |
          cp dist/release-notes/release-notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          - **AppImage** (Linux, any distro): `chmod +x Drift-*.AppImage && ./Drift-*.AppImage`
          - **Windows installer**: run `Drift-Setup-*.exe`
          - **macOS** (Apple Silicon): open `Drift-*-arm64.dmg` and drag Drift to Applications. The
            app is signed ad-hoc rather than notarised, so the first launch needs right-click →
            Open, or `xattr -dr com.apple.quarantine /Applications/Drift.app`.
          - **Arch Linux**: `sudo pacman -U drift-*.pkg.tar.zst`
          - **Flatpak**: requires `flatpak` with the Flathub remote added (`flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo`), then `flatpak install --user Drift-*.flatpak`

          Fonts, stickers, speech models and GPU/CPU acceleration runtimes are not bundled — install
          the ones you want from the Addon Manager in the app header.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Drift ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/linux-appimage/*.AppImage \
            dist/windows-installer/*.exe \
            dist/macos-dmg/*.dmg \
            dist/arch-package/*.pkg.tar.zst \
            dist/flatpak-bundle/*.flatpak
