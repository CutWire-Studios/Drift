name: Tests

# Runs the CTest suites on every push and pull request. package.yml also runs them, but only
# on a manual dispatch or a release tag — this is what keeps a regression from sitting on main
# until release day. Each job builds the same way package.yml's job for that platform does and
# then stops: no install tree, no AppImage, no DMG, no artifacts.
#
# Three platforms, because one is not enough: allocator and toolchain differences mean a defect
# can be reliably invisible on Linux and reliably fatal on macOS or under MSVC. See the macos
# job below.
on:
  push:
  pull_request:

# A second push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.10.3"
  QT_MODULES: >-
    qtmultimedia
    qtimageformats
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  # Same pin as package.yml: FFmpeg 7.1 gpl-shared, hosted on our CutWire-Studios/FFmpeg-Builds
  # fork so we are not tied to BtbN's moving `latest` tag (which dropped n7.1 on 2026-08-17).
  # The gpl variant, not lgpl: x264 and x265 are GPL, so the lgpl builds carry no H.264/H.265
  # encoder — which would leave the exporter tests with nothing to exercise.
  FFMPEG_REPO: "CutWire-Studios/FFmpeg-Builds"
  FFMPEG_TAG: "n7.1"

jobs:
  macos-icon:
    name: macOS adaptive icon
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The macos-15 application job also covers the static fallback. Exercise
      # the adaptive compiler separately without installing the app dependencies.
      - name: Compile adaptive icon
        run: |
          mkdir -p "$RUNNER_TEMP/drift-icon-assets"
          xcrun actool resources/macos/Drift.icon \
            --compile "$RUNNER_TEMP/drift-icon-assets" \
            --app-icon Drift \
            --enable-on-demand-resources NO \
            --target-device mac \
            --platform macosx \
            --minimum-deployment-target 12.0 \
            --output-partial-info-plist "$RUNNER_TEMP/drift-icon-assets/partial-info.plist" \
            --output-format human-readable-text --errors --warnings
          test -s "$RUNNER_TEMP/drift-icon-assets/Assets.car"
          test -s "$RUNNER_TEMP/drift-icon-assets/Drift.icns"
          for key in CFBundleIconFile CFBundleIconName; do
            test "$(/usr/libexec/PlistBuddy -c "Print :$key" \
              "$RUNNER_TEMP/drift-icon-assets/partial-info.plist")" = Drift
          done

      - name: Verify standalone fallback sizes
        run: |
          resources/macos/make-icns.sh "$RUNNER_TEMP/Drift-regenerated.icns"
          iconutil --convert iconset --output "$RUNNER_TEMP/committed.iconset" resources/macos/Drift.icns
          iconutil --convert iconset --output "$RUNNER_TEMP/regenerated.iconset" "$RUNNER_TEMP/Drift-regenerated.icns"
          for iconset in "$RUNNER_TEMP/committed.iconset" "$RUNNER_TEMP/regenerated.iconset"; do
            for pt in 16 32 128 256 512; do
              for scale in 1 2; do
                suffix=""
                if [[ "$scale" -eq 2 ]]; then suffix="@2x"; fi
                png="$iconset/icon_${pt}x${pt}${suffix}.png"
                pixels=$((pt * scale))
                test "$(sips -g pixelWidth "$png" | awk '/pixelWidth:/ {print $2}')" = "$pixels"
                test "$(sips -g pixelHeight "$png" | awk '/pixelHeight:/ {print $2}')" = "$pixels"
              done
            done
          done

  linux:
    name: CTest
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # fonts/, emoji-fonts/ and the addon effect catalogue are gitignored here — they are
      # content, delivered as addons. Without them 16 tests QSKIP. Drift-Addons is public and
      # commits everything except large weights (*.onnx/*.bin are gitignored there, with a
      # sibling .sha256 in their place), so a sparse checkout of these three trees is all it
      # takes. Sizes: fonts 18 MB, emoji font 44 MB, effects 6.3 MB, stickers 2 MB.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      # tests/CMakeLists.txt hardcodes where each of these lives, so put them where it looks.
      # The effects one is <source>/../drift-addons/... — outside the workspace, which
      # actions/checkout refuses to write to, hence the symlink rather than a second checkout.
      - name: Stage addon content where the tests expect it
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts "${GITHUB_WORKSPACE}/fonts"
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font "${GITHUB_WORKSPACE}/emoji-fonts"
          ln -s "${GITHUB_WORKSPACE}/drift-addons" "${GITHUB_WORKSPACE}/../drift-addons"
          # Assert rather than let 16 tests quietly go back to QSKIP if a path ever moves.
          test -f "${GITHUB_WORKSPACE}/fonts/anton/family.json"
          test -f "${GITHUB_WORKSPACE}/emoji-fonts/HarmonyOS_4.0.ttf"
          test -f "${GITHUB_WORKSPACE}/../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json"

      # The DeepFilterNet3 and Silero VAD weights and the ONNX Runtime are gitignored in Drift-Addons,
      # so they come from the public packages release. Unpacked where the tests look for them.
      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p onnxruntime.cpu.linux-x64-1.0.0.driftpkg
          python3 scripts/unpack-driftpkg.py "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python3 scripts/unpack-driftpkg.py "$dl/silero.vad-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad"
          python3 scripts/unpack-driftpkg.py "$dl/onnxruntime.cpu.linux-x64-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d "${GITHUB_WORKSPACE}/models/deepfilternet3"
          test -f "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx"
          test -f "${GITHUB_WORKSPACE}/.ort/runtime/lib/libonnxruntime.so"

      # Drop packages.microsoft.com (microsoft-prod *and* azure-cli — the latter's filename
      # does not match *microsoft*). The runner image adds both; we never install from them.
      # GitHub's apt-mirrors.txt tries azure.archive then archive.ubuntu.com; both have been
      # stalling, and the image's Acquire::Retries 10 makes a hang last until the job timeout.
      # Replace the list with Canonical's live geo-mirrors and cap Acquire so a dead one yields.
      # A stalled apt mirror otherwise sits here until the 60-minute job timeout; fail in 10.
      # libva* are runtime, not build, deps: Qt Multimedia's FFmpeg backend reaches VA-API
      # through implib-gen stubs whose generated dlopen failure path is assert(0), so any test
      # that constructs a QMediaDevices SIGABRTs on a runner without them rather than falling
      # back to software decode.
      - name: Install native build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          printf '%s\n' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
            'Acquire::Retries "2";' 'APT::Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          {
            curl -fsSL --max-time 8 http://mirrors.ubuntu.com/mirrors.txt || true
            echo "http://us.archive.ubuntu.com/ubuntu/"
            echo "http://security.ubuntu.com/ubuntu/"
          } | sed 's:/*$:/:' \
            | grep -vi 'azure.archive.ubuntu.com' \
            | grep -viE '^https?://archive\.ubuntu\.com/' \
            | awk 'NF && !seen[$0]++' \
            | awk '{ printf "%s\tpriority:%d\n", $0, NR }' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          # Complex-script text tests need Noto faces.
          sudo apt-get install -y -o Acquire::Retries=3 \
            build-essential ninja-build pkg-config git xvfb ccache fonts-noto-core \
            libgl1-mesa-dev libegl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libzstd-dev libssl-dev libsoundtouch-dev zlib1g-dev \
            libpulse-dev libasound2-dev \
            libva2 libva-drm2 libva-x11-2 \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            clang-15 lld libharfbuzz-dev libicu-dev libexpat1-dev libpng-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-cursor-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      # Deliberately the same key package.yml uses, so the two workflows share one JUCE clone
      # and ONNX header download instead of each paying for it.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-linux-${{ hashFiles('CMakeLists.txt') }}

      # The build tree is not cached, so every run reconfigures and recompiles from scratch —
      # ccache is what makes that cheap. The action saves only from main (PR-ref caches are
      # invisible to other refs) and keeps one entry, so the 10 GB repo budget is not eaten.
      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-tests-linux-
          max-size: 1G

      # Same Skia build package.yml's Linux lane makes, minus SKIA_SYSTEM_ICU=0: nothing is
      # bundled here, so the distro ICU is fine and the cache key stays separate on purpose.
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: third_party/prebuilt/skia/linux-x64
          key: v2-skia-tests-linux-x64-${{ hashFiles('third_party/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          JOBS="$(nproc)" CC=clang-15 CXX=clang++-15 third_party/build-skia.sh linux-x64
          rm -rf third_party/src

      - name: Fetch pinned FFmpeg
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          mkdir -p "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          curl -fsSL "https://github.com/${FFMPEG_REPO}/releases/download/${FFMPEG_TAG}/ffmpeg-${FFMPEG_TAG}-linux64-gpl-shared.tar.xz" \
            | tar -xJf - --strip-components=1 -C "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          # 16 tests synthesize their clips by running the ffmpeg CLI through QProcess and QSKIP
          # when QStandardPaths::findExecutable cannot find one. The runner image ships no ffmpeg,
          # but the tarball just extracted above does — so put it on PATH rather than skipping.
          echo "${GITHUB_WORKSPACE}/.deps/ffmpeg/bin" >> "${GITHUB_PATH}"

      - name: Verify ffmpeg is on PATH
        run: ffmpeg -hide_banner -encoders | grep -E "libx264|aac" | head -3

      # DRIFT_BUNDLE_ONNXRUNTIME=OFF: only the headers are needed to compile. The runtime is
      # dlopened from whichever Acceleration addon the user installs.
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/.deps/ffmpeg" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF \
            -DDRIFT_WITH_SKIA=ON \
            -DDRIFT_LINKER=lld \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Everything, not just the test targets: this is the only workflow that sees an ordinary
      # commit, so the app link and QML compilation should be covered here too.
      - name: Build
        id: build
        run: cmake --build build --parallel

      # Deliberately not QT_QPA_PLATFORM=offscreen: that plugin cannot create an OpenGL context
      # on a runner with no /dev/dri, so every compositor test would render a null QImage and
      # only some of them QSKIP on GpuEffectExecutor::isAvailable() — the rest would compare
      # against nothing and still pass. llvmpipe works fine once there is an X server.
      #
      # LD_LIBRARY_PATH is prepended rather than appended: install-qt-action puts Qt's lib dir on
      # it, and QtMultimedia ships its own libavcodec.so.61 under the same soname, built with no
      # external codec libraries. Appending let that copy win, so the suite ran against an FFmpeg
      # the app was never built against. Prepending also still supplies libpostproc.so.58, which
      # only the gpl FFmpeg ships and which libavfilter needs: CMake gives the test binaries a
      # build RPATH covering that directory but emits it as DT_RUNPATH, and the loader applies
      # RUNPATH only to the binary's own NEEDED entries, never to a dependency's.
      #
      # Serial, not ctest -j: the suites share QStandardPaths::AppDataLocation test-mode state.
      # The ONNX and sticker tests skip without these two; the workspace paths are where the
      # fetch and checkout steps above put the files.
      - name: Test
        id: test
        env:
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib:${LD_LIBRARY_PATH:-}"
          # Passing suites keep their output so the SKIP lines reach the junit report.
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure --output-log ctest.log \
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A suite that QSKIPs still passes, so the failure summary never shows what did not run.
      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The compile output is valid even when a test failed, so save unless the build itself broke.
      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-tests-linux-
          max-size: 1G

  # The macOS runner is the reason this job exists rather than trusting the Linux one. glibc's
  # allocator leaves a freed block byte-identical, so a use-after-free through a stale
  # `Track &`/`Clip &` reads back the right answer there and the suite stays green; macOS
  # libmalloc scribbles and recycles freed blocks across threads and fails immediately. That
  # exact bug shipped to main and only surfaced at release-packaging time.
  #
  # Not on every branch push: macOS runner minutes bill at a multiple of Linux, and a PR plus
  # main is where a regression actually needs catching.
  macos:
    name: CTest (macOS)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Same content, same reason, same layout as the linux job above.
      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      - name: Stage addon content where the tests expect it
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts "${GITHUB_WORKSPACE}/fonts"
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font "${GITHUB_WORKSPACE}/emoji-fonts"
          ln -s "${GITHUB_WORKSPACE}/drift-addons" "${GITHUB_WORKSPACE}/../drift-addons"
          test -f "${GITHUB_WORKSPACE}/fonts/anton/family.json"
          test -f "${GITHUB_WORKSPACE}/emoji-fonts/HarmonyOS_4.0.ttf"
          test -f "${GITHUB_WORKSPACE}/../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json"

      # Homebrew, not install-qt-action, and not the pinned FFmpeg the Linux job uses: Homebrew's
      # Qt links the same FFmpeg Drift does, so there is no second libavcodec in the process to
      # keep ABI-compatible. This is what package.yml's macos job does; keep the two in step.
      # Note the consequence — this job tests against Homebrew's FFmpeg 8.x while Linux tests
      # against the n7.1 pin.
      - name: Install dependencies
        run: |
          brew update
          brew install qt ffmpeg zstd openssl@3 sound-touch ninja ccache

      # Runs after Install dependencies because the unpacker needs zstd from Homebrew.
      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p onnxruntime.cpu.osx-arm64-1.0.0.driftpkg
          python3 scripts/unpack-driftpkg.py "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python3 scripts/unpack-driftpkg.py "$dl/silero.vad-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad"
          python3 scripts/unpack-driftpkg.py "$dl/onnxruntime.cpu.osx-arm64-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d "${GITHUB_WORKSPACE}/models/deepfilternet3"
          test -f "${GITHUB_WORKSPACE}/drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx"
          test -f "${GITHUB_WORKSPACE}/.ort/runtime/lib/libonnxruntime.dylib"

      # 16 tests synthesize their clips by shelling out to ffmpeg and QSKIP when they cannot find
      # one. Asserted rather than assumed: without this the job could go green having tested
      # nothing, which is the failure mode this whole job exists to prevent.
      - name: Verify ffmpeg is on PATH
        run: ffmpeg -hide_banner -encoders | grep -E "libx264|aac" | head -3

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-macos-${{ hashFiles('CMakeLists.txt') }}

      # Skia for macOS is compiled here from the pinned commit (Homebrew has no Skia) and cached
      # by script revision. HarfBuzz/ICU/FreeType are compiled in rather than taken from Homebrew,
      # whose versions move under a pinned Skia.
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: third_party/prebuilt/skia/mac-arm64
          key: v2-skia-mac-arm64-${{ hashFiles('third_party/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          JOBS="$(sysctl -n hw.ncpu)" third_party/build-skia.sh mac-arm64
          rm -rf third_party/src

      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-tests-macos-
          max-size: 1G

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix openssl@3);$(brew --prefix)" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF \
            -DDRIFT_WITH_SKIA=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        id: build
        run: cmake --build build --parallel

      # No xvfb and no QT_QPA_PLATFORM override: the runner has a real window server, so the
      # compositor tests get a genuine OpenGL context. Serial for the same reason as the Linux
      # job — the suites share QStandardPaths::AppDataLocation test-mode state.
      # The ONNX and sticker tests skip without these two; the workspace paths are where the
      # fetch and checkout steps above put the files.
      - name: Test
        id: test
        env:
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        # Passing suites keep their output so the SKIP lines reach the junit report.
        run: |
          ctest --test-dir build --output-on-failure --output-log ctest.log \
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A suite that QSKIPs still passes, so the failure summary never shows what did not run.
      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-tests-macos-
          max-size: 1G

  # Windows has its own toolchain (MSVC, vcpkg Skia, Qt's DLL search order), so a Linux or macOS
  # pass says nothing about it. Mirrors package.yml's windows lane up to the test run; the
  # ccache prefix and the vcpkg/FetchContent/Qt cache keys are deliberately identical so the two
  # workflows share one entry each (the repo cache budget is tight).
  windows:
    name: CTest (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_VERSION: "4.14.2"
      MESA_WIN_VERSION: "26.2.4"
    steps:
      - uses: actions/checkout@v4

      - name: Check out addon content
        uses: actions/checkout@v4
        with:
          repository: CutWire-Studios/Drift-Addons
          path: drift-addons
          sparse-checkout: |
            staging/fonts-essentials/fonts
            staging/stickers-harmonyos/emoji-font
            staging/stickers-harmonyos/stickers
            staging/effects-core/effects

      - name: Fetch test models and ONNX Runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="${RUNNER_TEMP}/driftpkg"
          mkdir -p "$dl"
          gh release download packages -R CutWire-Studios/Drift-Addons -D "$dl" \
            -p deepfilternet.v3-1.0.0.driftpkg -p silero.vad-1.0.0.driftpkg -p onnxruntime.cpu.win-x64-1.0.0.driftpkg
          python "scripts/unpack-driftpkg.py" "$dl/deepfilternet.v3-1.0.0.driftpkg" "${GITHUB_WORKSPACE}"
          python "scripts/unpack-driftpkg.py" "$dl/silero.vad-1.0.0.driftpkg" "drift-addons/staging/silero-vad"
          python "scripts/unpack-driftpkg.py" "$dl/onnxruntime.cpu.win-x64-1.0.0.driftpkg" "${GITHUB_WORKSPACE}/.ort"
          test -d models/deepfilternet3
          test -f drift-addons/staging/silero-vad/models/silero-vad/silero_vad.onnx
          test -f .ort/runtime/lib/onnxruntime.dll

      # A copy, not the Linux symlink: creating one outside the workspace needs elevation here.
      - name: Stage addon content where the tests expect it
        shell: bash
        run: |
          cp -r drift-addons/staging/fonts-essentials/fonts fonts
          cp -r drift-addons/staging/stickers-harmonyos/emoji-font emoji-fonts
          cp -r drift-addons ../drift-addons
          test -f fonts/anton/Anton-400.ttf
          test -f emoji-fonts/HarmonyOS_4.0.ttf
          test -f ../drift-addons/staging/effects-core/effects/turbulent_displace/effect.json

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          add-tools-to-path: true

      # Same key as package.yml, hashing package.yml itself (its vcpkg package list is what the
      # cache holds). Only main saves, so a PR never writes a ref-scoped copy that nothing else reads.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-x64-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}
          restore-keys: |
            vcpkg-bincache-win-x64-

      # Keep the package list and triplets identical to package.yml's Install vcpkg dependencies
      # step; see the comments there for why zlib and skia are static-md.
      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }
          .\vcpkg\vcpkg.exe install zstd openssl soundtouch --triplet x64-windows
          .\vcpkg\vcpkg.exe install zlib "skia[gl,harfbuzz,icu,freetype,png]" --triplet x64-windows-static-md

      - name: Save vcpkg binary cache
        if: always() && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-bincache-win-x64-${{ hashFiles('CMakeLists.txt', '.github/workflows/package.yml') }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: v2-deps-win-${{ hashFiles('CMakeLists.txt') }}

      - name: Fetch pinned FFmpeg
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .deps\ffmpeg, .deps\ffmpeg_extracted -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .deps\ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:FFMPEG_REPO/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .deps\ffmpeg_extracted -Force
          $extractedRoot = (Get-ChildItem .deps\ffmpeg_extracted)[0].FullName
          Copy-Item -Path "$extractedRoot\*" -Destination .deps\ffmpeg -Recurse -Force

      - name: Install ccache
        shell: pwsh
        run: |
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile ccache.zip
          Expand-Archive -Path ccache.zip -DestinationPath "$env:RUNNER_TEMP\ccache-bin" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ccache-bin\$name"
          & "$env:RUNNER_TEMP\ccache-bin\$name\ccache.exe" --version

      # Ninja needs the compiler environment; after the vcpkg step, which finds Visual Studio itself.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same prefix as package.yml's windows lane, so both read and write one cache entry.
      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          phase: restore
          key-prefix: ccache-windows-x64-
          max-size: 1G

      # DRIFT_PCH=OFF and the /Z7 settings are what let ccache cache MSVC objects; see package.yml.
      - name: Configure
        shell: pwsh
        run: |
          # vcpkg's zlib names its static library zs.lib up to 1.3.x and libzs.lib from 1.4.
          $zlibLib = @('libzs.lib', 'zs.lib') |
            ForEach-Object { "${{ github.workspace }}\vcpkg\installed\x64-windows-static-md\lib\$_" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $zlibLib) { throw "static-md zlib library not found" }
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};${{ github.workspace }}\.deps\ffmpeg;${{ github.workspace }}\vcpkg\installed\x64-windows-static-md" `
            -DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }} `
            -DZLIB_INCLUDE_DIR=${{ github.workspace }}\vcpkg\installed\x64-windows-static-md\include `
            -DZLIB_LIBRARY="$zlibLib" `
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF `
            -DDRIFT_WITH_SKIA=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DDRIFT_PCH=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      # --parallel 3: more risks MSVC heap exhaustion / OOM on the 4-core 16 GB runner.
      - name: Build
        id: build
        shell: pwsh
        run: cmake --build build --parallel 3

      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/ccache
        with:
          phase: save
          key-prefix: ccache-windows-x64-
          max-size: 1G

      # The runner's Mesa is OpenGL 3.0, so ~110 GPU tests skip; llvmpipe provides 4.5. The DLLs
      # go beside each test exe because opengl32.dll is in System32 and PATH cannot override it.
      - name: Install Mesa llvmpipe for the GPU tests
        shell: pwsh
        run: |
          $archive = "mesa.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_WIN_VERSION/mesa3d-$env:MESA_WIN_VERSION-release-msvc.7z" -OutFile $archive
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive -omesa -y | Out-Null
          # Only the GL pair: the rest would shadow system copies the D3D11 and decode tests rely on.
          $dlls = Get-Item mesa\x64\opengl32.dll, mesa\x64\libgallium_wgl.dll
          $testDirs = Get-ChildItem build -Recurse -Filter "tst_*.exe" | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          if (-not $testDirs) { throw "no tst_*.exe under build; the GPU tests would run on the system Mesa" }
          foreach ($dir in $testDirs) {
            Copy-Item $dlls.FullName $dir -Force
          }

      # .deps\ffmpeg\bin ahead of Qt's bin: Qt ships its own avcodec DLLs under the same names and
      # the suite must run against the FFmpeg it was built with. Serial for the shared
      # QStandardPaths test-mode state. QT_FORCE_STDERR_LOGGING: without it QPlainTestLogger sends
      # output to OutputDebugString when stdout is ctest's pipe, hiding every FAIL! line.
      - name: Test
        id: test
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: 1
          GALLIUM_DRIVER: llvmpipe
          DRIFT_ONNXRUNTIME_DIR: ${{ github.workspace }}/.ort/runtime
          DRIFT_STICKERS_DIR: ${{ github.workspace }}/drift-addons/staging/stickers-harmonyos/stickers
        run: |
          $env:PATH = "${{ github.workspace }}\.deps\ffmpeg\bin;${{ env.QT_ROOT_DIR }}\bin;$env:PATH"
          # Passing suites keep their output so the SKIP lines reach the junit report.
          ctest --test-dir build --output-on-failure --output-log ctest.log `
            --output-junit ctest-junit.xml --test-output-size-passed 20000000 --test-output-size-failed 20000000

      - name: Summarize test failures
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Failed tests"
            echo '```'
            sed -n '/^The following tests FAILED:/,/^Errors while running CTest/p' ctest.log | grep -v '^Errors while running CTest'
            echo
            grep -E -A1 '^(FAIL!|QFATAL)' ctest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize skipped tests
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          skipped="$(grep -ho 'SKIP   : [^<]*' build/ctest-junit.xml 2>/dev/null \
            | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' \
            | sort | uniq)"
          {
            echo '### Skipped tests'
            echo '```'
            if [ -n "$skipped" ]; then echo "$skipped"; else echo none; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
