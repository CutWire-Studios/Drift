app-id: org.cutwire.Drift
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
# clang for the Skia build: org.kde.Sdk ships gcc only, and Skia's GN toolchain files are written
# for clang. The extension is build-time only; nothing from it ends up in /app.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: drift

# Flathub variant of org.cutwire.Drift.yml. The only difference is the drift module's source: this
# one builds a tagged commit fetched from GitHub instead of the working tree, because Flathub builds
# from its own repository and cannot see a local checkout. Everything else must stay in step with
# the manifest next to it.

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio playback via QAudioSink (PipeWire/PulseAudio).
  - --socket=pulseaudio
  # The Addon Manager fetches signed .driftpkg packages from drift-addons.cutwire.org.
  - --share=network
  # OpenGL scene graph and the GPU compositor need direct rendering.
  - --device=dri
  # Media import/export goes through xdg-desktop-portal (the app deliberately uses
  # QApplication so QFileDialog is the native portal picker), so no broad --filesystem
  # is granted. Add --filesystem=host only if media access proves painful in testing.

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/aclocal
  - /share/doc
  - /share/man
  - "*.a"
  - "*.la"

modules:
  # Headers only. Drift does not link ONNX Runtime — it dlopens whichever build the user
  # installed from the Acceleration category, so the app ships none and neither does this
  # manifest. The library in this archive is deliberately discarded. Built with
  # -DDRIFT_FETCH_ONNXRUNTIME=OFF so the sandboxed build never downloads anything itself.
  - name: onnxruntime-headers
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/include
      - cp -a include/. ${FLATPAK_DEST}/include/
    sources:
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
        sha256: 547e40a48f1fe73e3f812d7c88a948612c23f896b91e4e2ee1e232d7b468246f
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-aarch64-1.27.0.tgz
        sha256: 3e4d83ac06924a32a07b6d7f91ce6f852876153fc0bbdf931bf517a140bfbe48
        strip-components: 1
        only-arches:
          - aarch64

  # Pitch shifting for the voice effects. Not in org.kde.Platform, so it is built here; the app
  # links it, which is fine for GPL-3.0 since LGPL-2.1 section 3 permits use under GPL v2 or later.
  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DSOUNDSTRETCH=OFF
      # Without this it lands in /app/lib64, where two things fail to look: pkg-config (so Drift
      # falls through to SoundTouch's own broken CMake config) and the runtime linker, whose path
      # inside the sandbox is /app/lib.
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      # Upstream's own release tarball rather than the Codeberg git repo: Codeberg 403s clones
      # from CI runner IP ranges. Byte-identical to the 2.4.1 tag's tree. Fetched from our
      # mirror first: www.surina.net times out from CI often enough to fail builds, and the
      # sha256 is upstream's either way.
      - type: archive
        url: https://github.com/CutWire-Studios/SoundTouch-Builds/releases/download/2.4.1/soundtouch-2.4.1.tar.gz
        mirror-urls:
          - https://www.surina.net/soundtouch/soundtouch-2.4.1.tar.gz
        sha256: e07abf20ce8f95850c280132e1f61ad400fc1f4011b7fac698a503de6aab6733

  # Skia's build generator. Not in the SDK and has no release tarballs, so it is built from source
  # with the SDK's gcc. --allow-warnings: gn builds with -Werror and trips over gcc's newer
  # warnings; the commit-position header is hand-written because there is no git metadata to
  # derive it from inside the sandbox.
  - name: gn
    buildsystem: simple
    build-commands:
      - CC=gcc CXX=g++ python3 build/gen.py --no-last-commit-position --allow-warnings --out-path=out
      - printf '#ifndef OUT_LAST_COMMIT_POSITION_H_\n#define OUT_LAST_COMMIT_POSITION_H_\n#define LAST_COMMIT_POSITION_NUM 0\n#define LAST_COMMIT_POSITION "0 (drift)"\n#endif\n' > out/last_commit_position.h
      - ninja -C out -j${FLATPAK_BUILDER_N_JOBS} gn
      - install -Dm755 out/gn ${FLATPAK_DEST}/bin/gn
    sources:
      - type: git
        url: https://gn.googlesource.com/gn
        commit: 0625da07ece7b1a374ec0719b6f40ebe3d0950c1

  # buildsystem: simple rather than cmake-ninja because Skia has to be compiled first, from the
  # script inside this very source tree (third_party/build-skia.sh), against the Skia tarball
  # declared below — flatpak-builder has no hook for a pre-configure step.
  - name: drift
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
    build-commands:
      - case "$FLATPAK_ARCH" in x86_64) t=linux-x64 ;; aarch64) t=linux-arm64 ;; *) echo "no Skia target for $FLATPAK_ARCH" >&2; exit 1 ;; esac;
        CC=clang CXX=clang++ JOBS=${FLATPAK_BUILDER_N_JOBS} third_party/build-skia.sh "$t"
      - cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_BUILD_TYPE=Release
        -DDRIFT_WITH_SKIA=ON
        -DDRIFT_FETCH_ONNXRUNTIME=OFF
        -DDRIFT_BUNDLE_ONNXRUNTIME=OFF
        -DONNXRUNTIME_ROOT=/app
        -DDRIFT_FETCH_JUCE=OFF
        -DDRIFT_JUCE_DIR=juce
        -DDRIFT_UPDATE_FEED_URL=
        -DDRIFT_AUTO_UPDATE_TRANSLATIONS=OFF
      - cmake --build build -j${FLATPAK_BUILDER_N_JOBS}
      - cmake --install build
    # Option notes:
    #   DRIFT_FETCH_JUCE=OFF — JUCE is checked out as a source below rather than fetched by CMake:
    #     the build runs with no network, so FetchContent would fail here.
    #   DRIFT_UPDATE_FEED_URL= — Flathub updates this build, so the in-app update check is compiled
    #     out: an app that nags about a version flatpak will fetch on its own is noise the user
    #     cannot act on.
    #   DRIFT_AUTO_UPDATE_TRANSLATIONS=OFF — a package build compiles the committed catalogs and
    #     never regenerates them. org.kde.Sdk's lupdate has no QML parser, so a refresh here strips
    #     every QML string from i18n/*.ts and ships .qm files that only translate the C++ side
    #     (#167). CMake also detects this on its own; the flag makes the intent explicit, since
    #     flatpak-builder hides CI from the sandbox.
    sources:
      # TODO: fill in v0.5.1's commit sha before opening the PR. flatpak-builder requires it —
      # a tag alone is not a fixed input.
      - type: git
        url: https://github.com/CutWire-Studios/Drift.git
        tag: v0.5.1
        commit: "0000000000000000000000000000000000000000"
      # Audio effect DSP. Only juce_dsp and its dependencies are compiled; nothing GUI-facing.
      - type: git
        url: https://github.com/juce-framework/JUCE.git
        tag: 8.0.15
        commit: 91ad83ae34a81e0833b1a2b0866f54846370ae53
        dest: juce
      # Skia at the commit third_party/build-skia.sh pins, unpacked where the script looks for it so
      # it never reaches for the network. Keep url, sha256 and dest in step with the script.
      - type: archive
        url: https://github.com/google/skia/archive/e7c90ecca9444fe09598f1630ab7cee2c0ee027a.tar.gz
        sha256: 7b5158952ebc4e2ce8de19f036b7613e266705003469579d9e98070ead62fc3b
        dest: third_party/src/skia-e7c90ecca9444fe09598f1630ab7cee2c0ee027a
